<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instagram Pull-To-Refresh</title>
  <style>
    /* CRITICAL FIX: Disables Chrome & Safari native pull-to-refresh */
    html, body {
      overscroll-behavior-y: contain;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Fixed Top Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid #1a1a1a;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-icon {
      font-size: 22px;
    }

    /* Container for the loader revealed in the gap */
    .refresh-gap {
      position: fixed;
      top: 50px; /* Sits right beneath fixed header */
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1; /* Below header, above hidden background */
    }

    /* Instagram-Style Spinner Ring */
    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.5) rotate(0deg);
      transition: opacity 0.1s ease;
    }

    .spinner.refreshing {
      opacity: 1;
      transform: scale(1);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Content Container (Pushed down on pull) */
    .feed-container {
      margin-top: 50px;
      position: relative;
      z-index: 10;
      background-color: #000000;
      will-change: transform;
    }

    .feed-container.smooth-reset {
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Stories Bar */
    .stories-bar {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #1a1a1a;
    }

    .story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2.5px;
    }

    .story-ring.mine { background: #333; }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #262626;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .post {
      height: 400px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <span class="header-icon">＋</span>
    <span class="header-title">Instagram</span>
    <span class="header-icon">♡</span>
  </header>

  <!-- Hidden loader inside the gap -->
  <div class="refresh-gap">
    <div class="spinner" id="spinner"></div>
  </div>

  <!-- Feed that pulls away from header -->
  <main class="feed-container" id="feedContainer">
    <div class="stories-bar">
      <div class="story">
        <div class="story-ring mine"><div class="avatar">+</div></div>
        <span>Your story</span>
      </div>
      <div class="story">
        <div class="story-ring"><div class="avatar">F1</div></div>
        <span>ts0gyal._</span>
      </div>
      <div class="story">
        <div class="story-ring"><div class="avatar">MH</div></div>
        <span>mi_haaaruu</span>
      </div>
      <div class="story">
        <div class="story-ring"><div class="avatar">MM</div></div>
        <span>maisha_m</span>
      </div>
    </div>

    <div class="post">Post Content</div>
    <div class="post">Post Content</div>
  </main>

  <script>
    const feed = document.getElementById('feedContainer');
    const spinner = document.getElementById('spinner');

    let startY = 0;
    let pullDistance = 0;
    let isPulling = false;
    let isRefreshing = false;

    const TRIGGER_GAP = 70; // Depth of the gap created
    const RESISTANCE = 0.4;  // Smooth drag friction multiplier

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0 && !isRefreshing) {
        startY = e.touches[0].clientY;
        isPulling = true;
        feed.classList.remove('smooth-reset');
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling || isRefreshing) return;

      const currentY = e.touches[0].clientY;
      const rawPull = currentY - startY;

      if (rawPull > 0 && window.scrollY === 0) {
        // Stop browser default reload action completely
        if (e.cancelable) e.preventDefault(); 

        pullDistance = rawPull * RESISTANCE;
        
        // Push the feed down, opening up the gap
        feed.style.transform = `translateY(${pullDistance}px)`;

        // Scale and spin loader proportional to drag distance
        const progress = Math.min(pullDistance / TRIGGER_GAP, 1);
        spinner.style.opacity = progress;
        spinner.style.transform = `scale(${progress}) rotate(${progress * 240}deg)`;
      }
    }, { passive: false }); // MUST be passive: false to allow preventDefault()

    window.addEventListener('touchend', () => {
      if (!isPulling || isRefreshing) return;
      isPulling = false;
      feed.classList.add('smooth-reset');

      if (pullDistance >= TRIGGER_GAP) {
        startRefreshing();
      } else {
        resetPull();
      }
    });

    function startRefreshing() {
      isRefreshing = true;
      feed.style.transform = `translateY(${TRIGGER_GAP}px)`;
      spinner.classList.add('refreshing');

      // Simulate a 1.5s content fetch delay
      setTimeout(() => {
        spinner.classList.remove('refreshing');
        resetPull();
        setTimeout(() => { isRefreshing = false; }, 300);
      }, 1500);
    }

    function resetPull() {
      pullDistance = 0;
      feed.style.transform = 'translateY(0px)';
      if (!isRefreshing) {
        spinner.style.opacity = '0';
        spinner.style.transform = 'scale(0.5) rotate(0deg)';
      }
    }
  </script>
</body>
</html>
