<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Pull to Refresh Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Fixed Top Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid #1a1a1a;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-icon {
      font-size: 22px;
      cursor: pointer;
    }

    /* Refresh Indicator Spinner (Positioned behind header) */
    .refresh-container {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      transform: scale(0) rotate(0deg);
      opacity: 0;
    }

    .spinner.refreshing {
      animation: spin 0.75s linear infinite;
      opacity: 1;
      transform: scale(1);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Feed Wrapper pushed down on pull */
    .feed-wrapper {
      margin-top: 50px;
      will-change: transform;
    }

    .feed-wrapper.reset-transition {
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Instagram Stories UI */
    .stories-container {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #1a1a1a;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2px;
    }

    .story-ring.user-story {
      background: #333;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #262626;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* Sample Feed Post */
    .post {
      margin-top: 10px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
    }

    .post-header .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #dc2743);
    }

    .post-image {
      width: 100%;
      height: 360px;
      background-color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <span class="header-icon">+</span>
    <span class="header-title">Instagram</span>
    <span class="header-icon">♡</span>
  </header>

  <div class="refresh-container">
    <div class="spinner" id="spinner"></div>
  </div>

  <main class="feed-wrapper" id="feedWrapper">
    <div class="stories-container">
      <div class="story-item">
        <div class="story-ring user-story"><div class="avatar">+</div></div>
        <span>Your story</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="avatar">F1</div></div>
        <span>ts0gyal._</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="avatar">MH</div></div>
        <span>mi_haaaruu</span>
      </div>
      <div class="story-item">
        <div class="story-ring"><div class="avatar">MM</div></div>
        <span>maisha_m</span>
      </div>
    </div>

    <article class="post">
      <div class="post-header">
        <div class="avatar-sm"></div>
        <strong>f1</strong>
      </div>
      <div class="post-image">Post Content Area</div>
    </article>
  </main>

  <script>
    const feed = document.getElementById('feedWrapper');
    const spinner = document.getElementById('spinner');

    let startY = 0;
    let currentY = 0;
    let pullDistance = 0;
    let isPulling = false;
    let isRefreshing = false;

    const PULL_THRESHOLD = 70; // Distance needed to trigger refresh
    const DAMPING = 0.45; // Smooth dragging resistance

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0 && !isRefreshing) {
        startY = e.touches[0].clientY;
        isPulling = true;
        feed.classList.remove('reset-transition');
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling || isRefreshing) return;

      currentY = e.touches[0].clientY;
      const rawDistance = currentY - startY;

      if (rawDistance > 0 && window.scrollY === 0) {
        pullDistance = rawDistance * DAMPING;
        feed.style.transform = `translateY(${pullDistance}px)`;

        // Scale and rotate spinner based on pull distance
        const progress = Math.min(pullDistance / PULL_THRESHOLD, 1);
        spinner.style.transform = `scale(${progress}) rotate(${progress * 180}deg)`;
        spinner.style.opacity = progress;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isPulling || isRefreshing) return;
      isPulling = false;
      feed.classList.add('reset-transition');

      if (pullDistance >= PULL_THRESHOLD) {
        triggerRefresh();
      } else {
        resetPull();
      }
    });

    function triggerRefresh() {
      isRefreshing = true;
      feed.style.transform = `translateY(${PULL_THRESHOLD}px)`;
      spinner.style.transform = `scale(1)`;
      spinner.classList.add('refreshing');

      // Simulate network request delay (1.5 seconds)
      setTimeout(() => {
        spinner.classList.remove('refreshing');
        resetPull();
        setTimeout(() => { isRefreshing = false; }, 300);
      }, 1500);
    }

    function resetPull() {
      pullDistance = 0;
      feed.style.transform = 'translateY(0px)';
      if (!isRefreshing) {
        spinner.style.transform = 'scale(0) rotate(0deg)';
        spinner.style.opacity = '0';
      }
    }
  </script>
</body>
</html>
