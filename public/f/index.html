<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Instagram Web Demo</title>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Prevent Native Browser Pull-to-Refresh */
    html, body {
      overscroll-behavior-y: contain;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed Top Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid #efefef;
    }

    .brand-logo {
      font-family: 'Style Script', cursive, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-actions {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    /* Pull to Refresh Spinner Gap */
    .refresh-gap {
      position: fixed;
      top: 50px;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      background-color: #fafafa;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid #dbdbdb;
      border-top-color: #262626;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.5) rotate(0deg);
      transition: opacity 0.1s ease;
    }

    .spinner.refreshing {
      opacity: 1;
      transform: scale(1);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scrollable Feed Area */
    .feed-container {
      margin-top: 50px;
      margin-bottom: 55px; /* Space for bottom nav */
      background-color: #ffffff;
      will-change: transform;
      position: relative;
      z-index: 10;
    }

    .feed-container.smooth-reset {
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Stories Section */
    .stories-bar {
      display: flex;
      gap: 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #efefef;
      scrollbar-width: none;
    }
    .stories-bar::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #262626;
      cursor: pointer;
    }

    .story-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 2.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-ring.my-story {
      background: #dbdbdb;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #ffffff;
      object-fit: cover;
      background: #fafafa;
    }

    /* Post Card with Curved Styling */
    .post-card {
      border-bottom: 1px solid #efefef;
      padding-bottom: 12px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }

    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 13px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-media-wrapper {
      width: 100%;
      padding: 0 8px; /* Curved edge padding */
    }

    .post-image {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 12px; /* Curved Edges */
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px 4px 14px;
    }

    .action-group {
      display: flex;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      padding: 4px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .icon-btn:active {
      background: #f0f0f0;
    }

    .post-details {
      padding: 0 14px;
      font-size: 13px;
    }

    .likes-count {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .caption span {
      font-weight: 600;
      margin-right: 6px;
    }

    /* Fixed Footer Navigation Bar */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid #efefef;
      z-index: 100;
    }

    .footer-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #262626;
    }

    /* Story Overlay / Modal Demo */
    .story-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .story-modal.active {
      display: flex;
    }

    .story-progress-bar {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      height: 2.5px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }

    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .story-modal img {
      width: 100%;
      height: 80vh;
      object-fit: cover;
      border-radius: 16px;
    }

    .close-story {
      position: absolute;
      top: 24px;
      right: 16px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <span class="brand-logo">Instagram</span>
    <div class="header-actions">
      <button class="icon-btn"><i data-lucide="heart"></i></button>
      <button class="icon-btn"><i data-lucide="message-circle"></i></button>
    </div>
  </header>

  <!-- Gap Revealed During Pull Down -->
  <div class="refresh-gap">
    <div class="spinner" id="spinner"></div>
  </div>

  <!-- Feed Container -->
  <main class="feed-container" id="feedContainer">
    
    <!-- Stories Carousel -->
    <div class="stories-bar">
      <div class="story-item">
        <div class="story-ring my-story">
          <img class="story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Your Story" />
        </div>
        <span>Your story</span>
      </div>
      <div class="story-item" onclick="openStory('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80')">
        <div class="story-ring">
          <img class="story-avatar" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80" alt="Story 1" />
        </div>
        <span>ts0gyal._</span>
      </div>
      <div class="story-item" onclick="openStory('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80')">
        <div class="story-ring">
          <img class="story-avatar" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=150&q=80" alt="Story 2" />
        </div>
        <span>mi_haaaruu</span>
      </div>
      <div class="story-item" onclick="openStory('https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=600&q=80')">
        <div class="story-ring">
          <img class="story-avatar" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=150&q=80" alt="Story 3" />
        </div>
        <span>maisha_m</span>
      </div>
    </div>

    <!-- Posts Feed -->
    <article class="post-card">
      <div class="post-header">
        <div class="post-user">
          <img class="user-avatar" src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?auto=format&fit=crop&w=100&q=80" alt="F1 Avatar" />
          <span>f1</span>
        </div>
        <button class="icon-btn"><i data-lucide="more-horizontal"></i></button>
      </div>

      <div class="post-media-wrapper">
        <img class="post-image" src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=800&q=80" alt="F1 Car Post" />
      </div>

      <div class="post-actions">
        <div class="action-group">
          <button class="icon-btn"><i data-lucide="heart"></i></button>
          <button class="icon-btn"><i data-lucide="message-circle"></i></button>
          <button class="icon-btn"><i data-lucide="send"></i></button>
        </div>
        <button class="icon-btn"><i data-lucide="bookmark"></i></button>
      </div>

      <div class="post-details">
        <div class="likes-count">124,592 likes</div>
        <div class="caption"><span>f1</span>Pusher to the limit standard! 🏎️💨</div>
      </div>
    </article>

  </main>

  <!-- Bottom Navigation Bar Footer -->
  <footer>
    <button class="icon-btn"><i data-lucide="home"></i></button>
    <button class="icon-btn"><i data-lucide="search"></i></button>
    <button class="icon-btn"><i data-lucide="plus-square"></i></button>
    <button class="icon-btn"><i data-lucide="clapperboard"></i></button>
    <button class="icon-btn">
      <img class="footer-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Profile" />
    </button>
  </footer>

  <!-- Interactive Story Modal Viewer -->
  <div class="story-modal" id="storyModal">
    <div class="story-progress-bar">
      <div class="story-progress-fill" id="storyProgress"></div>
    </div>
    <span class="close-story" onclick="closeStory()"><i data-lucide="x"></i></span>
    <img id="storyImage" src="" alt="Story content" />
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Pull to Refresh Logic
    const feed = document.getElementById('feedContainer');
    const spinner = document.getElementById('spinner');

    let startY = 0;
    let pullDistance = 0;
    let isPulling = false;
    let isRefreshing = false;

    const TRIGGER_GAP = 70;
    const RESISTANCE = 0.4;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0 && !isRefreshing) {
        startY = e.touches[0].clientY;
        isPulling = true;
        feed.classList.remove('smooth-reset');
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling || isRefreshing) return;

      const currentY = e.touches[0].clientY;
      const rawPull = currentY - startY;

      if (rawPull > 0 && window.scrollY === 0) {
        if (e.cancelable) e.preventDefault(); 
        pullDistance = rawPull * RESISTANCE;
        
        feed.style.transform = `translateY(${pullDistance}px)`;

        const progress = Math.min(pullDistance / TRIGGER_GAP, 1);
        spinner.style.opacity = progress;
        spinner.style.transform = `scale(${progress}) rotate(${progress * 240}deg)`;
      }
    }, { passive: false });

    window.addEventListener('touchend', () => {
      if (!isPulling || isRefreshing) return;
      isPulling = false;
      feed.classList.add('smooth-reset');

      if (pullDistance >= TRIGGER_GAP) {
        startRefreshing();
      } else {
        resetPull();
      }
    });

    function startRefreshing() {
      isRefreshing = true;
      feed.style.transform = `translateY(${TRIGGER_GAP}px)`;
      spinner.classList.add('refreshing');

      setTimeout(() => {
        spinner.classList.remove('refreshing');
        resetPull();
        setTimeout(() => { isRefreshing = false; }, 300);
      }, 1500);
    }

    function resetPull() {
      pullDistance = 0;
      feed.style.transform = 'translateY(0px)';
      if (!isRefreshing) {
        spinner.style.opacity = '0';
        spinner.style.transform = 'scale(0.5) rotate(0deg)';
      }
    }

    // Interactive Story Demo Logic
    let storyTimer;
    function openStory(imgUrl) {
      const modal = document.getElementById('storyModal');
      const img = document.getElementById('storyImage');
      const progress = document.getElementById('storyProgress');

      img.src = imgUrl;
      modal.classList.add('active');
      progress.style.width = '0%';

      let width = 0;
      clearInterval(storyTimer);
      storyTimer = setInterval(() => {
        if (width >= 100) {
          closeStory();
        } else {
          width += 2;
          progress.style.width = width + '%';
        }
      }, 60);
    }

    function closeStory() {
      clearInterval(storyTimer);
      document.getElementById('storyModal').classList.remove('active');
    }
  </script>
</body>
</html>
