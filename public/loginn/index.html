<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #0064e0;
            --primary-hover: #0052cc;
            --text-dark: #1c1e21;
            --text-muted: #65676b;
            --bg-body: #ffffff;
            --bg-input: #ffffff; 
            --border-color: #dadde1;
            --gradient-accent: linear-gradient(135deg, #ff007f, #ff7a00);
            --error-red: #ed4956;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Allow scrolling but hide the visual scrollbar */
        body {
            background-color: var(--bg-body);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-dark);
            overflow-y: auto; 
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .container {
            display: flex;
            flex: 1;
            width: 100%;
            height: 100%;
            max-width: 1440px; 
            margin: 0 auto;
        }

        /* --- Left Column: Visuals (50%) --- */
        .visual-section {
            width: 50%;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 2rem 3rem;
            flex-shrink: 0; 
            min-height: 100vh;
        }

        .brand-logo {
            position: absolute;
            top: 2.5rem;
            left: 3rem;
            height: 40px;
            object-fit: contain;
            z-index: 10;
        }

        .visual-wrapper {
            margin: auto; 
            position: relative;
            left: 3rem; 
            width: 100%;
            max-width: 460px; 
            padding-top: 4rem; 
            padding-bottom: 4rem; 
        }

        .visual-section h1 {
            font-size: 3.2rem; 
            font-weight: 400;
            line-height: 1.15;
            text-align: left; 
            margin-bottom: 3rem;
            letter-spacing: -0.03em;
        }

        .highlight {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .mockup-container {
            position: relative;
            width: 320px;
            height: 380px;
            transform: scale(1.15); 
            transform-origin: top left;
            margin-top: 1rem;
        }

        .mockup-card {
            position: absolute;
            width: 220px;
            height: 320px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 8px solid #fff;
            transition: transform 0.3s ease;
        }

        .mockup-card.back {
            top: 0;
            right: 20px;
            background: linear-gradient(145deg, #a1c4fd 0%, #c2e9fb 100%);
            transform: rotate(8deg);
        }

        .mockup-card.middle {
            top: 20px;
            left: 20px;
            background: linear-gradient(145deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            transform: rotate(-4deg);
        }

        .mockup-card.front {
            top: 50px;
            left: 50px;
            background: #f8f9fa;
            transform: rotate(2deg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .mockup-header {
            height: 40px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }
        
        .mockup-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ccc;
        }
        
        .mockup-line {
            height: 6px;
            width: 60px;
            background: #eaeaea;
            border-radius: 4px;
        }

        /* --- Right Column: Form Area (50%) --- */
        .form-section {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            flex-shrink: 0;
            min-height: 100vh;
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 1.5rem;
        }

        .form-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Instagram-style Error Alert Box */
        .error-alert {
            display: none;
            color: var(--error-red);
            font-size: 14px;
            text-align: center;
            margin-bottom: 1.25rem;
            line-height: 1.4;
            font-weight: 400;
            padding: 10px 14px;
            background-color: #fff5f5;
            border: 1px solid #ffe0e0;
            border-radius: 8px;
        }

        .input-group {
            margin-bottom: 1rem;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color); 
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        #passwordInput {
            padding-right: 48px;
        }

        .input-group input:focus,
        .input-group input:active {
            border-color: #555555; 
            box-shadow: none; 
        }

        .input-group input::placeholder {
            color: #8d949e;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: #8d949e;
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--text-dark);
        }

        .lucide {
            width: 20px;
            height: 20px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 100px; 
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .link-forgot {
            display: block;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin: 1.5rem 0 2rem 0; 
        }

        .link-forgot:hover {
            text-decoration: none;
        }

        .btn-sso {
            background-color: transparent;
            color: var(--text-dark);
            font-weight: 600;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .btn-sso:hover {
            background-color: #f5f6f8;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .form-footer {
            margin-top: 2.5rem;
            display: flex;
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .form-footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: var(--text-dark);
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .visual-section {
                display: none; 
            }
            .form-section {
                width: 100%;
                padding: 4rem 1rem 2rem 1rem;
                min-height: 100vh;
            }
            body::before {
                content: "";
                background-image: url('https://i.imghippo.com/files/fRGt5603uII.png');
                background-repeat: no-repeat;
                background-size: contain;
                position: absolute;
                top: 1.5rem;
                left: 1.5rem;
                width: 120px;
                height: 40px;
            }
        }

        @media (max-height: 800px) and (min-width: 1025px) {
            .visual-section h1 {
                font-size: 2.6rem;
                margin-bottom: 1.5rem;
            }
            .mockup-container {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>

    <main class="container">
        
        <!-- Left: Modern Visual Area -->
        <section class="visual-section">
            <img src="https://i.imghippo.com/files/fRGt5603uII.png" alt="Edulink Logo" class="brand-logo">
            
            <div class="visual-wrapper">
                <h1>Helping Learners discover their <br> <span class="highlight">Inner Ter.</span></h1>
                
                <div class="mockup-container">
                    <div class="mockup-card back"></div>
                    <div class="mockup-card middle"></div>
                    <div class="mockup-card front">
                        <div class="mockup-header">
                            <div class="mockup-avatar"></div>
                            <div class="mockup-line"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right: Modern Form Area -->
        <section class="form-section">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Log into your account</h2>
                </div>
                
                <!-- Instagram-Style Error Alert Box -->
                <div id="errorAlert" class="error-alert">
                    Sorry, your password was incorrect. Please double-check your password.
                </div>

                <form id="loginForm" action="#" method="POST">
                    <div class="input-group">
                        <input type="email" id="emailInput" placeholder="Mobile number, username or email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="passwordInput" placeholder="Password" required>
                        <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Log in</button>
                </form>

                <a href="#" class="link-forgot">Forgot password?</a>

                <!-- Google SSO Button -->
                <button type="button" id="googleSsoBtn" class="btn btn-sso">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Log in with Google
                </button>
                
                <button type="button" class="btn btn-outline">Create new account</button>

                <!-- Footer content -->
                <div class="form-footer">
                    <a href="/newton">Newton</a>
                    <a href="/terms">Terms</a>
                    <a href="/privacy">Privacy</a>
                    <a href="/blog">Blog</a>
                    <a href="https://idembt.vercel.app">Idem</a>
                    <span>&copy; 2026 Edulink</span>
                </div>
            </div>
        </section>
        
    </main>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAJH79UQl0rc96Qug0DKLevO4ZI_sn8Kno",
            authDomain: "edulinki.firebaseapp.com",
            projectId: "edulinki",
            storageBucket: "edulinki.firebasestorage.app",
            messagingSenderId: "248886466474",
            appId: "1:248886466474:web:160043201a6b28bafbbdd3",
            measurementId: "G-MQBH12VL7N"
        };

        // Initialize Firebase & Auth
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // DOM elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorAlert = document.getElementById('errorAlert');
        const googleSsoBtn = document.getElementById('googleSsoBtn');

        // Helper to show Instagram-style error
        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
        }

        // Helper to clear error
        function hideError() {
            errorAlert.style.display = 'none';
        }

        // Hide alert when user starts typing again
        emailInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);

        // Handle Email/Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // Login successful
                console.log("Logged in successfully:", userCredential.user);
                alert("Logged in successfully!");
            } catch (error) {
                console.error("Firebase Login Error:", error.code);
                
                // Instagram-style error messaging
                if (
                    error.code === 'auth/wrong-password' || 
                    error.code === 'auth/user-not-found' || 
                    error.code === 'auth/invalid-credential'
                ) {
                    showError("Sorry, your password was incorrect. Please double-check your password.");
                } else if (error.code === 'auth/invalid-email') {
                    showError("The email address you entered is invalid.");
                } else if (error.code === 'auth/too-many-requests') {
                    showError("Too many failed attempts. Please try again later.");
                } else {
                    showError("There was a problem logging you in. Please check your credentials.");
                }
            }
        });

        // Handle Google SSO Login
        googleSsoBtn.addEventListener('click', async () => {
            hideError();
            try {
                const result = await signInWithPopup(auth, googleProvider);
                console.log("Google Sign-In success:", result.user);
                alert("Google Sign-In successful!");
            } catch (error) {
                console.error("Google Auth Error:", error);
                showError("Could not sign in with Google. Please try again.");
            }
        });
    </script>

    <!-- UI Scripts -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Password Show/Hide Toggle
        const passwordInputUI = document.getElementById('passwordInput');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        passwordInputUI.addEventListener('input', function() {
            if (this.value.length > 0) {
                togglePasswordBtn.style.display = 'flex';
            } else {
                togglePasswordBtn.style.display = 'none';
            }
        });

        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInputUI.getAttribute('type') === 'password';
            passwordInputUI.setAttribute('type', isPassword ? 'text' : 'password');
            
            this.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
            passwordInputUI.focus();
        });
    </script>
</body>
</html>
