<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduLink BHT</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dcpuyfslg/image/upload/v1787148469/idem_yezwx3.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Syne', sans-serif;
      /* Disable selection across elements */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      width: 100%;
      position: fixed; /* Prevents pull-to-refresh & mobile page scrolling */
      top: 0;
      left: 0;
      overflow: hidden; /* Guaranteed no scrollbars */
      touch-action: none; /* Prevents touch dragging/scrolling on mobile devices */
      background-color: #ffffff;
      color: #000000;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Disable drag, context menu, and long-press saving on all images */
    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none; /* Prevents clicks, holding, and dragging */
    }

    /* Allow interaction for form inputs and clickable links */
    input, button, a {
      -webkit-user-select: auto;
      -moz-user-select: auto;
      -ms-user-select: auto;
      user-select: auto;
      pointer-events: auto;
    }

    /* Top-Left Logo Capsule */
    .brand-capsule {
      position: fixed;
      top: 28px;
      left: 28px;
      display: inline-flex;
      align-items: center;
      height: 48px;
      width: 48px;
      padding-left: 9px;
      border-radius: 50px;
      border: 1px solid #e8e8e8;
      background-color: #ffffff;
      text-decoration: none;
      color: #000000;
      overflow: hidden;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      z-index: 10;
    }

    .brand-capsule img {
      height: 28px;
      width: 28px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-capsule .brand-text {
      max-width: 0;
      opacity: 0;
      white-space: nowrap;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      transition: max-width 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  margin-left 0.35s ease;
    }

    .brand-capsule:hover {
      width: 150px;
    }

    .brand-capsule:hover .brand-text {
      max-width: 100px;
      opacity: 1;
      margin-left: 10px;
    }

    /* Top-Right Redirect Link */
    .top-right-link {
      position: fixed;
      top: 38px;
      right: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #555555;
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s ease;
    }

    .top-right-link:hover {
      color: #000000;
    }

    .top-right-link svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    /* Left-Aligned Login Container */
    .main-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      z-index: 2;
    }

    .login-wrapper {
      width: 100%;
      max-width: 350px;
      text-align: left;
      transform: translateY(65px);
    }

    h1 {
      font-size: 2.35rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.12;
      margin-bottom: 0.85rem;
      color: #000000;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #707070;
      line-height: 1.45;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .field-group {
      margin-bottom: 0.85rem;
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      font-size: 0.9rem;
      color: #000000;
      background-color: #f2f2f2;
      border: 1px solid transparent;
      border-radius: 12px;
      outline: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    input[type="password"],
    input.password-field {
      padding-right: 44px;
    }

    input::placeholder {
      color: #aaaaaa;
      font-weight: 400;
    }

    input:focus {
      background-color: #ffffff;
      border-color: #d6d6d6;
    }

    /* Show/Hide Password Toggle */
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: #888888;
      stroke-width: 2px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      margin-top: 0.5rem;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button[type="submit"]:hover {
      opacity: 0.88;
    }

    .meta-links {
      margin-top: 1.8rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }

    .meta-links a {
      color: #888888;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .meta-links a:hover {
      color: #000000;
    }

    /* Edge-to-Edge Protected Footer */
    footer {
      width: 100vw;
      line-height: 0;
      flex-shrink: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    footer img {
      width: 100%;
      height: 28vh;
      min-height: 160px;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- Top-Left Logo Capsule -->
  <a href="#" class="brand-capsule">
    <img src="https://res.cloudinary.com/dcpuyfslg/image/upload/v1787140183/idem_bv7it3.png" alt="EduLink Logo" draggable="false">
    <span class="brand-text">EduLink</span>
  </a>

  <!-- Top-Right External Redirect Link -->
  <a href="https://idembt.vercel.app" target="_blank" rel="noopener noreferrer" class="top-right-link">
    <span>idembt.vercel.app</span>
    <i data-lucide="arrow-up-right"></i>
  </a>

  <!-- Center Form -->
  <main class="main-container">
    <div class="login-wrapper">
      <h1>Discover Your<br>Inner Ter</h1>
      <p class="subtitle">A social media platform that helps learners discover their Inner Ter.</p>
      
      <form>
        <div class="field-group">
          <input type="text" placeholder="Email or username" required autocomplete="off">
        </div>
        <div class="field-group">
          <input type="password" id="passwordInput" class="password-field" placeholder="Password" required>
          <button type="button" id="passwordToggle" class="password-toggle" aria-label="Toggle password visibility">
            <i data-lucide="eye" id="eyeIcon"></i>
            <i data-lucide="eye-off" id="eyeOffIcon" style="display: none;"></i>
          </button>
        </div>
        <button type="submit">Continue</button>
        <div class="meta-links">
          <a href="/reset">Forgot password?</a>
          <a href="/idem">Create account</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Edge-to-Edge Footer -->
  <footer>
    <img src="https://res.cloudinary.com/dcpuyfslg/image/upload/v1787144307/n_1_1_ap4utx.png" alt="Footer graphic landscape" draggable="false">
  </footer>

  <script>
    lucide.createIcons();

    const passwordInput = document.getElementById('passwordInput');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    passwordInput.addEventListener('input', () => {
      if (passwordInput.value.length > 0) {
        passwordToggle.classList.add('visible');
      } else {
        passwordToggle.classList.remove('visible');
      }
    });

    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
    });
  </script>

</body>
</html>
