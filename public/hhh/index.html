<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0a0a0c] text-white selection:bg-white/20">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Liquid Glass Navigation & OpenStreetMap</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Iconify Library for Solar Icons -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <!-- Leaflet OpenStreetMap Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Apple Dark Liquid Glass Capsule */
    .apple-glass {
      background: rgba(22, 22, 28, 0.65);
      backdrop-filter: blur(40px) saturate(170%) brightness(1.02);
      -webkit-backdrop-filter: blur(40px) saturate(170%) brightness(1.02);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.2),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.6),
        0 24px 48px -12px rgba(0, 0, 0, 0.85);
    }

    /* Specular Liquid Active Pill */
    .apple-glass-pill {
      background: rgba(255, 255, 255, 0.17);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.35),
        0 8px 20px -4px rgba(0, 0, 0, 0.6);
    }

    /* Modal Display Glass Overlay */
    .glass-card {
      background: rgba(18, 18, 24, 0.82);
      backdrop-filter: blur(45px) saturate(180%);
      -webkit-backdrop-filter: blur(45px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Dark Mode Leaflet Map Customization */
    .leaflet-container {
      background: #0a0a0c !important;
      font-family: inherit;
    }
    .leaflet-control-zoom {
      border: none !important;
      margin-top: 84px !important;
      margin-right: 16px !important;
    }
    .leaflet-control-zoom-in, .leaflet-control-zoom-out {
      background: rgba(22, 22, 28, 0.75) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      border-radius: 12px !important;
      width: 38px !important;
      height: 38px !important;
      line-height: 36px !important;
      font-size: 16px !important;
      margin-bottom: 8px !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6) !important;
    }
    .leaflet-control-attribution {
      background: rgba(10, 10, 12, 0.5) !important;
      color: rgba(255, 255, 255, 0.35) !important;
      backdrop-filter: blur(12px) !important;
      font-size: 10px !important;
      padding: 2px 8px !important;
      border-top-left-radius: 8px !important;
    }
    .leaflet-control-attribution a {
      color: rgba(255, 255, 255, 0.5) !important;
    }

    /* Prevent selection and default dragging behaviors */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
  </style>
</head>
<body class="h-full w-full bg-[#0a0a0c] text-white font-sans antialiased overflow-hidden select-none">

  <!-- MAIN MAP & CONTAINER STACK -->
  <div class="relative w-full h-screen overflow-hidden">

    <!-- Leaflet OpenStreetMap Layer (Base Viewport) -->
    <div id="map" class="absolute inset-0 w-full h-full z-0"></div>

    <!-- TOP FLOATING HEADER: USER LOCATION & STATUS -->
    <header class="fixed top-5 left-0 right-0 z-30 px-4 flex justify-center pointer-events-none">
      <div class="pointer-events-auto apple-glass rounded-full px-4 py-2.5 flex items-center justify-between w-full max-w-md shadow-2xl">
        <div class="flex items-center space-x-3">
          <!-- Active Location Pulse Indicator -->
          <div class="relative flex h-3 w-3 items-center justify-center">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </div>
          <!-- Location Text -->
          <div class="flex flex-col">
            <span id="user-location-text" class="text-xs font-semibold text-white tracking-tight flex items-center gap-1">
              Nishitokyo, Tokyo
              <iconify-icon icon="solar:alt-arrow-down-bold" class="text-[10px] text-white/50"></iconify-icon>
            </span>
            <span class="text-[10px] text-white/50 font-medium">GPS Signal • Active</span>
          </div>
        </div>

        <!-- Recenter Action Button -->
        <button onclick="recenterMap()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all flex items-center justify-center text-white" title="Re-center Map">
          <iconify-icon icon="solar:gps-bold" class="text-base text-white"></iconify-icon>
        </button>
      </div>
    </header>

    <!-- BOTTOM GRADIENT FADE MASK (Seamless Transition from Map to Void) -->
    <div class="pointer-events-none fixed bottom-0 left-0 right-0 h-60 bg-gradient-to-t from-[#0a0a0c] via-[#0a0a0c]/85 via-40% to-transparent z-10"></div>

    <!-- FLOATING DOCK CONTAINER (Sits Above the Fade Layer) -->
    <div id="mobile-dock" class="fixed bottom-9 left-0 right-0 z-20 flex justify-center items-center px-4 pointer-events-none">
      <div class="pointer-events-auto flex items-center space-x-3">
        
        <!-- MAIN CAPSULE DOCK -->
        <div id="capsule-h" class="apple-glass relative rounded-full p-2 flex items-center space-x-1.5 no-select overflow-hidden cursor-grab active:cursor-grabbing">
          
          <!-- Inner Track -->
          <div id="track-h" class="relative flex items-center space-x-1.5">
            
            <!-- Dynamic Specular Highlight Pill -->
            <div id="pill-h" class="apple-glass-pill absolute top-0 left-0 h-[56px] rounded-full pointer-events-none z-0"></div>

            <!-- TAB 0: HOME -->
            <button data-tab="0" class="nav-btn-h relative z-10 h-[56px] rounded-full flex items-center justify-center text-white px-3.5 group shrink-0" title="Home">
              <iconify-icon icon="solar:home-2-linear" class="icon-outline text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <iconify-icon icon="solar:home-2-bold" class="icon-solid hidden text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <span class="tab-label text-xs font-medium tracking-wide text-white transition-all duration-300 whitespace-nowrap overflow-hidden max-w-0 opacity-0 ml-0">Home</span>
            </button>

            <!-- TAB 1: MAP -->
            <button data-tab="1" class="nav-btn-h relative z-10 h-[56px] rounded-full flex items-center justify-center text-white px-3.5 group shrink-0" title="Map">
              <iconify-icon icon="solar:map-point-linear" class="icon-outline text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <iconify-icon icon="solar:map-point-bold" class="icon-solid hidden text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <span class="tab-label text-xs font-medium tracking-wide text-white transition-all duration-300 whitespace-nowrap overflow-hidden max-w-0 opacity-0 ml-0">Map</span>
            </button>

            <!-- TAB 2: FAVORITES -->
            <button data-tab="2" class="nav-btn-h relative z-10 h-[56px] rounded-full flex items-center justify-center text-white px-3.5 group shrink-0" title="Favorites">
              <iconify-icon icon="solar:heart-linear" class="icon-outline text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <iconify-icon icon="solar:heart-bold" class="icon-solid hidden text-[26px] text-white shrink-0 transition-transform duration-200 group-hover:scale-105"></iconify-icon>
              <span class="tab-label text-xs font-medium tracking-wide text-white transition-all duration-300 whitespace-nowrap overflow-hidden max-w-0 opacity-0 ml-0">Favorites</span>
            </button>

            <!-- TAB 3: PROFILE (Clean Avatar - No Outer Ring) -->
            <button data-tab="3" class="nav-btn-h relative z-10 h-[56px] rounded-full flex items-center justify-center text-white px-3.5 group shrink-0" title="Profile">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Profile" class="profile-avatar w-7 h-7 rounded-full object-cover shrink-0 transition-opacity duration-200" />
              <span class="tab-label text-xs font-medium tracking-wide text-white transition-all duration-300 whitespace-nowrap overflow-hidden max-w-0 opacity-0 ml-0">Profile</span>
            </button>

          </div>
        </div>

        <!-- SEPARATE FLOATING "+" ACTION BUTTON (Only Plus Icon - No Circle Wrapper) -->
        <button onclick="openActionModal()" class="w-[56px] h-[56px] rounded-full apple-glass flex items-center justify-center text-white hover:bg-white/15 active:scale-95 transition-all group shrink-0 shadow-2xl" title="Create">
          <iconify-icon icon="solar:add-linear" class="text-[28px] text-white transition-transform duration-300 group-hover:rotate-90"></iconify-icon>
        </button>

      </div>
    </div>

  </div>

  <!-- FLOATING ACTION MODAL -->
  <div id="modal-action" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-xl flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 flex flex-col space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-white/10 pb-3">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2">
          <iconify-icon icon="solar:add-linear" class="text-lg text-white"></iconify-icon>
          <span>Create New</span>
        </h3>
        <button onclick="closeActionModal()" class="p-1 text-white/60 hover:text-white">
          <iconify-icon icon="solar:close-circle-linear" class="text-xl"></iconify-icon>
        </button>
      </div>

      <div class="space-y-2 text-xs">
        <button onclick="execAction('Pin Saved')" class="w-full p-3 rounded-2xl glass-card hover:bg-white/15 text-left text-white font-medium transition-all flex items-center gap-2.5">
          <iconify-icon icon="solar:map-point-add-linear" class="text-base text-white"></iconify-icon>
          <span>Drop Pin at Current Location</span>
        </button>
        <button onclick="execAction('Story Created')" class="w-full p-3 rounded-2xl glass-card hover:bg-white/15 text-left text-white font-medium transition-all flex items-center gap-2.5">
          <iconify-icon icon="solar:pen-new-square-linear" class="text-base text-white"></iconify-icon>
          <span>Create Story Post</span>
        </button>
        <button onclick="execAction('Saved to Favorites')" class="w-full p-3 rounded-2xl glass-card hover:bg-white/15 text-left text-white font-medium transition-all flex items-center gap-2.5">
          <iconify-icon icon="solar:bookmark-linear" class="text-base text-white"></iconify-icon>
          <span>Bookmark Location</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION BOX -->
  <div id="toast" class="fixed top-20 right-6 z-50 glass-card px-4 py-3 rounded-2xl text-xs text-white border border-white/15 shadow-2xl flex items-center space-x-2.5 -translate-y-20 opacity-0 transition-all duration-300">
    <iconify-icon icon="solar:check-circle-bold" class="text-emerald-400 text-base"></iconify-icon>
    <span id="toast-text">Notification</span>
  </div>

  <script>
    // State Variables
    let activeTab = 1; // Default to Map
    let audioCtx = null;
    let map = null;
    let userMarker = null;

    // Default Coordinates (Nishitokyo, Tokyo)
    const defaultCoords = [35.7270, 139.5401];

    // Physics Animation Variables
    let currentPos = 0;
    let targetPos = 0;
    let currentWidth = 56;
    let targetWidth = 56;

    // Pointer Physics State (Zero Stumble Logic)
    let pointerDown = false;
    let isDragging = false;
    let startPointerX = 0;
    let startPillPos = 0;

    /* Leaflet OpenStreetMap Initialization */
    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        attributionControl: true
      }).setView(defaultCoords, 14);

      // Dark Matter CartoDB Tiles (OpenStreetMap Data Base)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
      }).addTo(map);

      // Liquid Glass Pulsing Custom User Marker
      const customIcon = L.divIcon({
        className: 'custom-user-pin',
        html: `
          <div class="relative flex items-center justify-center w-8 h-8">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-40"></span>
            <div class="relative w-4 h-4 rounded-full bg-white border-2 border-[#0a0a0c] shadow-2xl"></div>
          </div>
        `,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      userMarker = L.marker(defaultCoords, { icon: customIcon }).addTo(map);

      // Geolocation Detection
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const newPos = [lat, lng];
            map.setView(newPos, 15);
            userMarker.setLatLng(newPos);
            document.getElementById('user-location-text').innerText = "Current Location";
          },
          () => {},
          { timeout: 8000 }
        );
      }
    }

    function recenterMap() {
      if (map && userMarker) {
        playHaptic();
        map.flyTo(userMarker.getLatLng(), 15, { duration: 1.2 });
        showToast("Map Centered");
      }
    }

    // Crisp Audio Haptic Feedback
    function playHaptic() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function getNavBtns() {
      return Array.from(document.querySelectorAll('.nav-btn-h'));
    }

    function updateTargetPos() {
      const btns = getNavBtns();
      if (!btns || !btns[activeTab]) return;
      targetPos = btns[activeTab].offsetLeft;
      targetWidth = btns[activeTab].offsetWidth;
    }

    /* 60fps Smooth Interpolation Loop */
    function renderLoop() {
      const pill = document.getElementById('pill-h');
      const btns = getNavBtns();

      if (pill && btns.length > 0) {
        
        // 1. Icon states & text expansion logic
        btns.forEach((btn, idx) => {
          const label = btn.querySelector('.tab-label');
          const outlineIcon = btn.querySelector('.icon-outline');
          const solidIcon = btn.querySelector('.icon-solid');
          const avatar = btn.querySelector('.profile-avatar');

          const isSelected = (idx === activeTab);

          if (isSelected) {
            btn.classList.add('opacity-100');
            btn.classList.remove('opacity-60');
            if (outlineIcon) outlineIcon.classList.add('hidden');
            if (solidIcon) solidIcon.classList.remove('hidden');
            if (avatar) avatar.classList.add('opacity-100');
          } else {
            btn.classList.remove('opacity-100');
            btn.classList.add('opacity-60');
            if (outlineIcon) outlineIcon.classList.remove('hidden');
            if (solidIcon) solidIcon.classList.add('hidden');
            if (avatar) avatar.classList.add('opacity-80');
          }

          // Expand text label ONLY on drag release
          if (isSelected && !isDragging) {
            if (label) {
              label.classList.remove('max-w-0', 'opacity-0', 'ml-0');
              label.classList.add('max-w-[90px]', 'opacity-100', 'ml-2');
            }
          } else {
            if (label) {
              label.classList.remove('max-w-[90px]', 'opacity-100', 'ml-2');
              label.classList.add('max-w-0', 'opacity-0', 'ml-0');
            }
          }
        });

        // 2. Dynamic target dimensions
        if (isDragging) {
          targetWidth = 56; // Contract to neat square during drag
        } else {
          updateTargetPos();
        }

        // Smooth Exponential Lerp (Eliminating Stumbles)
        if (!isDragging) {
          currentPos += (targetPos - currentPos) * 0.22;
        }
        currentWidth += (targetWidth - currentWidth) * 0.22;

        pill.style.transform = `translate3d(${currentPos.toFixed(2)}px, 0, 0)`;
        pill.style.width = `${currentWidth.toFixed(2)}px`;
      }

      requestAnimationFrame(renderLoop);
    }

    /* Ultra-Smooth Pointer Interactions */
    function setupPhysicsInteractions() {
      const capsule = document.getElementById('capsule-h');
      if (!capsule) return;

      const onPointerDown = (e) => {
        pointerDown = true;
        isDragging = false;
        startPointerX = e.clientX;
        startPillPos = currentPos;
        try { capsule.setPointerCapture(e.pointerId); } catch(err) {}
      };

      const onPointerMove = (e) => {
        if (!pointerDown) return;

        const deltaX = e.clientX - startPointerX;

        // Slop distance check
        if (!isDragging && Math.abs(deltaX) > 3) {
          isDragging = true;
        }

        if (isDragging) {
          const btns = getNavBtns();
          const maxOffset = btns[btns.length - 1].offsetLeft;

          // Direct 1:1 position mapping
          const rawPos = startPillPos + deltaX;
          currentPos = Math.max(0, Math.min(maxOffset, rawPos));

          // Hover Target Detection
          let closestIdx = 0;
          let minDist = Infinity;
          btns.forEach((btn, i) => {
            const dist = Math.abs(currentPos - btn.offsetLeft);
            if (dist < minDist) {
              minDist = dist;
              closestIdx = i;
            }
          });

          if (closestIdx !== activeTab) {
            activeTab = closestIdx;
            playHaptic();
          }
        }
      };

      const onPointerUp = (e) => {
        if (!pointerDown) return;

        if (!isDragging) {
          // Direct tap logic
          const btn = e.target.closest('.nav-btn-h');
          if (btn) {
            const tabIdx = parseInt(btn.dataset.tab, 10);
            if (!isNaN(tabIdx) && tabIdx !== activeTab) {
              activeTab = tabIdx;
              playHaptic();
            }
          }
        }

        pointerDown = false;
        isDragging = false;
        updateTargetPos();

        try { capsule.releasePointerCapture(e.pointerId); } catch(err) {}
      };

      capsule.addEventListener('pointerdown', onPointerDown);
      capsule.addEventListener('pointermove', onPointerMove);
      capsule.addEventListener('pointerup', onPointerUp);
      capsule.addEventListener('pointercancel', onPointerUp);
    }

    // Modal Control Logic
    function openActionModal() {
      playHaptic();
      document.getElementById('modal-action').classList.remove('hidden');
    }
    function closeActionModal() {
      document.getElementById('modal-action').classList.add('hidden');
    }
    function execAction(msg) {
      closeActionModal();
      showToast(`${msg}`);
    }

    // Toast Notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 2200);
    }

    // Resize Handler
    window.addEventListener('resize', () => {
      updateTargetPos();
      currentPos = targetPos;
      currentWidth = targetWidth;
    });

    // Boot Loader
    window.onload = function() {
      initMap();
      updateTargetPos();
      currentPos = targetPos;
      currentWidth = targetWidth;
      setupPhysicsInteractions();
      requestAnimationFrame(renderLoop);
    };
  </script>
</body>
</html>
