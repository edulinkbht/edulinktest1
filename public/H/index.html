<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" id="themeColorMeta" content="#ffffff">
<title>EduLink</title>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* =====================================================
   RESET & BASE
===================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; }
::-webkit-scrollbar { display: none; width: 0; background: transparent; }

html { background: #ffffff; color: #111; transition: background .25s ease, color .25s ease; overscroll-behavior-y: none; scrollbar-width: none; -ms-overflow-style: none; }
html.dark { background: #000000; color: #fff; }

body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, sans-serif; min-height: 100vh; overscroll-behavior-y: none; }
button { border: none; background: transparent; cursor: pointer; color: inherit; }
button:focus, button:focus-visible { outline: none; }

/* =====================================================
   HEADER
===================================================== */
header { height: 68px; width: 100%; display: flex; align-items: center; background: #ffffff; transition: background .25s ease; position: relative; z-index: 50; }
html.dark header { background: #000000; }
.header-inner { position: relative; width: 100%; max-width: 1000px; margin: auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
.logo { position: absolute; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 800; letter-spacing: -1.2px; pointer-events: none; }
.menu-btn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; transition: transform .15s ease; margin-left: -10px; }
.menu-btn:active { transform: scale(.84); }
.header-placeholder { width: 44px; height: 44px; }

/* =====================================================
   FEED & POST STRUCTURE
===================================================== */
main { width: 100%; max-width: 600px; margin: auto; padding: 12px 6px 90px; position: relative; z-index: 10; }
.post { width: 100%; border: 0; margin-bottom: 44px; }
.post-header { display: flex; align-items: center; padding: 0 6px 10px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; margin-right: 12px; flex-shrink: 0; }
.user { flex: 1; }
.username { font-size: 14.5px; font-weight: 700; }
.date { color: #8d8d93; font-size: 12px; margin-top: 2px; }
.more { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transition: transform .15s ease; }
.more:active { transform: scale(.84); }
.caption { font-size: 15.5px; line-height: 1.5; padding: 0 6px 14px; color: #111; }
html.dark .caption { color: #f5f5f5; }
.post-image { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px; border: 1px solid rgba(0,0,0,0.04); }
html.dark .post-image { border-color: rgba(255,255,255,0.06); }

/* INTERACTION CAPSULES */
.post-bottom { padding: 12px 4px 0; display: flex; align-items: center; justify-content: space-between; }
.interaction-capsule { display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 4px 10px; background: #ffffff; border: 1px solid #e8e8e8; border-radius: 999px; transition: background .25s ease, border-color .25s ease; }
html.dark .interaction-capsule { background: #181818; border-color: #2a2a2a; }

.capsule-divider { width: 1px; height: 18px; background: #e0e0e0; margin: 0 4px; }
html.dark .capsule-divider { background: #333333; }

.action { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; transition: transform .15s ease; flex-shrink: 0; }
.action:active { transform: scale(.84); }
.action svg { width: 22px; height: 22px; stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; }
.like.liked { color: #ff3045; }
.like.liked svg { fill: currentColor; }
.repost.reposted { color: #00c853; }

.liked-avatars { display: flex; align-items: center; margin-left: 2px; }
.liked-avatars img { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ffffff; object-fit: cover; margin-left: -8px; transition: border-color .25s ease; }
.liked-avatars img:first-child { margin-left: 0; }
html.dark .liked-avatars img { border-color: #181818; }
.capsule-count { font-size: 13.5px; font-weight: 700; margin: 0 4px 0 2px; }

/* =====================================================
   SETTINGS PAGE
===================================================== */
.settings-page { 
    position: fixed; inset: 0; width: 100%; height: 100%; 
    background: #ffffff; z-index: 3000; 
    transform: translateX(100%); visibility: hidden; pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.35, 1), visibility 0s 0.4s, background 0.25s ease;
    display: flex; flex-direction: column;
}
html.dark .settings-page { background: #000000; }
body.settings-active .settings-page { 
    transform: translateX(0); visibility: visible; pointer-events: auto;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.35, 1), visibility 0s 0s; 
}

.settings-header { 
    display: flex; align-items: center; justify-content: space-between; 
    padding: 0 16px; height: 60px; flex-shrink: 0;
    margin-top: env(safe-area-inset-top);
}
.settings-header .close-btn, .settings-header .info-btn { 
    width: 44px; height: 44px; display: grid; place-items: center; 
    border-radius: 50%; transition: transform 0.15s ease;
}
.settings-header .close-btn:active, .settings-header .info-btn:active { transform: scale(0.85); }
.settings-header .close-btn svg { width: 32px; height: 32px; stroke-width: 2.5; }
.settings-header .info-btn svg { width: 24px; height: 24px; stroke-width: 2; }
.settings-header h2 { font-size: 18px; font-weight: 700; text-align: center; flex: 1; }

.search-wrapper { padding: 12px 20px; flex-shrink: 0; }
.solid-search {
    display: flex; align-items: center; gap: 12px;
    height: 48px; border-radius: 16px; padding: 0 16px;
    background: #f0f0f5; border: none;
    transition: background 0.3s ease;
}
html.dark .solid-search { background: #1c1c1e; }
.solid-search svg { color: #666; width: 20px; height: 20px; }
html.dark .solid-search svg { color: #aaa; }
.solid-search input {
    flex: 1; height: 100%; background: transparent; border: none; outline: none;
    font-size: 15.5px; color: #111; font-weight: 500;
}
html.dark .solid-search input { color: #fff; }
.solid-search input::placeholder { color: #888; font-weight: 400; }

.settings-body { flex: 1; overflow-y: auto; padding: 10px 20px; }
.settings-group { background: #f8f8f8; border-radius: 20px; overflow: hidden; margin-bottom: 24px; transition: background .25s ease; }
html.dark .settings-group { background: #141414; }

.settings-btn { 
    width: 100%; padding: 16px 20px; text-align: left; font-size: 16px; font-weight: 600; 
    background: transparent; border-bottom: 1px solid #ebebeb; 
    display: flex; align-items: center; gap: 16px; transition: background .2s ease; 
}
html.dark .settings-btn { border-bottom-color: #222; color: #fff; }
.settings-btn:last-child { border-bottom: none; }
.settings-btn:active { background: #eeeeee; }
html.dark .settings-btn:active { background: #1f1f1f; }
.settings-btn svg { width: 22px; height: 22px; stroke-width: 2; color: #111; }
html.dark .settings-btn svg { color: #fff; }
.settings-btn .right-slot { margin-left: auto; font-size: 15px; color: #888; font-weight: 500; }

/* =====================================================
   DRAWER SYSTEM (Comments & Replies)
===================================================== */
.comment-overlay { 
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
    background: rgba(0,0,0,0.65); 
    z-index: 1000; opacity: 0; visibility: hidden; pointer-events: none; 
    transition: opacity 0.3s ease, background 0.3s ease, visibility 0s 0.3s; 
}
body.drawer-open .comment-overlay { 
    opacity: 1; visibility: visible; pointer-events: auto; 
    transition: opacity 0.3s ease, background 0.3s ease, visibility 0s; 
}

.drawer-base { 
    position: fixed; bottom: 0; left: 0; width: 100%; height: 78vh; 
    background: #ffffff; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; 
    box-shadow: 0 -10px 40px rgba(0,0,0,0.1); touch-action: pan-y; 
    visibility: hidden; pointer-events: none; 
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, visibility 0s 0.3s; 
}
html.dark .drawer-base { background: #181818; box-shadow: 0 -10px 40px rgba(0,0,0,0.7); }

.comment-drawer { z-index: 1001; transform: translateY(100%); }
body.drawer-open .comment-drawer { transform: translateY(0); visibility: visible; pointer-events: auto; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), visibility 0s; }

.replies-drawer { z-index: 1002; transform: translateX(100%); }
body.replies-open .replies-drawer { transform: translateX(0); visibility: visible; pointer-events: auto; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), visibility 0s; }

.drawer-header { display: flex; align-items: center; justify-content: center; height: 60px; border-bottom: 1px solid #efefef; position: relative; flex-shrink: 0; z-index: 10; }
html.dark .drawer-header { border-bottom-color: #2a2a2a; }

.drag-handle { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 36px; height: 4px; background: #e0e0e0; border-radius: 4px; }
html.dark .drag-handle { background: #444; }

.drawer-header h3 { font-size: 16px; font-weight: 700; margin-top: 8px; }

.header-action-btn { position: absolute; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #111; transition: transform .15s ease; }
html.dark .header-action-btn { color: #fff; }
.header-action-btn:active { transform: scale(.84); }
.header-action-btn svg { width: 22px; height: 22px; }
.close-drawer { right: 16px; top: 12px; }
.back-drawer { left: 16px; top: 12px; }

.drawer-body { flex: 1; overflow-y: auto; padding: 20px 16px; }

.comment-item { display: flex; gap: 12px; position: relative; padding: 10px; margin-bottom: 8px; border-radius: 14px; cursor: pointer; transition: background 0.15s ease; }
.comment-item:active { background: rgba(0,0,0,0.03); }
html.dark .comment-item:active { background: rgba(255,255,255,0.05); }

.avatar-wrapper { display: flex; flex-direction: column; align-items: center; width: 36px; flex-shrink: 0; }
.avatar-wrapper .avatar { width: 36px; height: 36px; margin: 0; border-radius: 50%; object-fit: cover; }
.thread-line { flex: 1; width: 2px; background: #efefef; margin-top: 8px; margin-bottom: -16px; border-radius: 2px; }
html.dark .thread-line { background: #333; }
.comment-item:last-child .thread-line { display: none; }

.comment-content { flex: 1; }
.comment-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.comment-top-left { display: flex; align-items: baseline; gap: 8px; }
.comment-top .username { font-weight: 700; font-size: 14px; }
.comment-top .time { color: #888; font-size: 12px; }
.comment-text { font-size: 14.5px; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }

.comment-action-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.comment-capsule { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 2px 8px; background: #f6f6f6; border: 1px solid #eeeeee; border-radius: 999px; }
html.dark .comment-capsule { background: #222; border-color: #333; }

.comment-capsule .action { display: flex; align-items: center; justify-content: center; gap: 4px; width: auto; min-width: 28px; height: 28px; padding: 0 4px; border-radius: 14px; }
.comment-capsule .action svg { width: 15px; height: 15px; stroke-width: 2.2; }
.comment-capsule .comment-count { font-size: 12.5px; font-weight: 600; color: #666; }
html.dark .comment-capsule .comment-count { color: #aaa; }

/* REPLY BUTTON */
.reply-action-btn {
    display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; height: 28px;
    font-size: 12.5px; font-weight: 700; color: #555; border-radius: 14px;
    transition: background 0.15s ease, color 0.15s ease;
}
html.dark .reply-action-btn { color: #bbb; }
.reply-action-btn:active { background: rgba(0,0,0,0.08); }
html.dark .reply-action-btn:active { background: rgba(255,255,255,0.15); }
.reply-action-btn svg { width: 14px; height: 14px; stroke-width: 2.2; }

.view-replies-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 8px 4px 0; font-size: 13px; font-weight: 600; color: #777; }
html.dark .view-replies-btn { color: #aaa; }
.reply-avatars { display: flex; align-items: center; }
.reply-avatars img { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; margin-left: -6px; }

.drawer-footer { display: flex; align-items: center; gap: 12px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #f0f0f0; flex-shrink: 0; z-index: 10; position: relative; background: #fff; transition: background .25s ease, border-color .25s ease; }
html.dark .drawer-footer { border-top-color: #2a2a2a; background: #181818; }
.drawer-footer .avatar { width: 38px; height: 38px; margin: 0; border-radius: 50%; }

.comment-input { flex: 1; height: 42px; background: transparent; border: 1px solid #d1d1d6; border-radius: 21px; padding: 0 16px; font-size: 14.5px; color: inherit; outline: none; transition: border-color 0.2s; }
html.dark .comment-input { border-color: #444; }
.comment-input:focus { border-color: #007aff; }

.send-comment { width: 42px; height: 42px; display: grid; place-items: center; color: #111; transition: transform 0.15s ease; flex-shrink: 0; }
.send-comment:active { transform: scale(0.85); }
html.dark .send-comment { color: #fff; }
.send-comment svg { width: 24px; height: 24px; stroke-width: 1.8; transform: rotate(15deg) translateY(-1px) translateX(-1px); }

/* =====================================================
   ACTION SHEETS
===================================================== */
.action-sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease, visibility 0s 0.3s; }
body.sheet-open .action-sheet-overlay { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.3s ease, visibility 0s; }

.action-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 440px; background: #fff; border-radius: 24px 24px 0 0; z-index: 2001; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); visibility: hidden; pointer-events: none; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, visibility 0s 0.3s; }
html.dark .action-sheet { background: #181818; }
body.sheet-open.post-sheet-active #postActionSheet { transform: translateX(-50%) translateY(0); visibility: visible; pointer-events: auto; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease, visibility 0s; }

.sheet-handle { width: 40px; height: 4px; background: #e0e0e0; border-radius: 4px; margin: 0 auto 16px; }
html.dark .sheet-handle { background: #444; }
.sheet-menu { background: #f4f4f4; border-radius: 16px; overflow: hidden; margin-bottom: 12px; }
html.dark .sheet-menu { background: #222; }

.sheet-btn { width: 100%; padding: 16px; text-align: left; font-size: 15px; font-weight: 500; background: transparent; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; gap: 12px; transition: background .2s ease; }
html.dark .sheet-btn { border-bottom-color: #333; color: #fff; }
.sheet-btn:last-child { border-bottom: none; }
.sheet-btn:active { background: #e8e8e8; }
html.dark .sheet-btn:active { background: #333; }
.sheet-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.sheet-btn.danger { color: #ff3045; }
.sheet-btn.danger svg { color: #ff3045; }

.sheet-cancel { width: 100%; padding: 16px; font-size: 15px; font-weight: 600; text-align: center; background: #f4f4f4; border-radius: 16px; transition: background .2s ease; }
html.dark .sheet-cancel { background: #222; color: #fff; }
.sheet-cancel:active { background: #e8e8e8; }
html.dark .sheet-cancel:active { background: #333; }

/* NAVIGATION */
.nav-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; color: #000000; transition: color .2s ease, transform .15s ease; }
html.dark .nav-icon { color: #ffffff; }
.nav-icon svg { width: 28px; height: 28px; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.nav-icon:active { transform: scale(.84); }
.nav-icon.active svg { stroke-width: 2.5; transform: scale(1.04); }

.desktop-nav { display: none; }
.mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 66px; display: flex; align-items: center; justify-content: space-around; background: #ffffff; z-index: 100; border-top: 1px solid #e8e8e8; padding-bottom: env(safe-area-inset-bottom); transition: background .25s ease, border-color .25s ease; }
html.dark .mobile-nav { background: #000000; border-top: 1px solid #2a2a2a; }

@media (min-width: 768px) {
    .mobile-nav { display: none; }
    .desktop-nav { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 100; }
    main { max-width: 540px; margin-left: calc(50vw - 270px + 40px); padding-top: 24px; }
    .drawer-base { bottom: auto; top: 50%; left: calc(50% + 40px); width: 540px; height: 80vh; max-height: 800px; border-radius: 20px; }
    .comment-drawer { transform: translate(-50%, -45%) scale(0.95); opacity: 0; }
    body.drawer-open .comment-drawer { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; pointer-events: auto; }
    .replies-drawer { transform: translate(-30%, -50%); opacity: 0; }
    body.replies-open .replies-drawer { transform: translate(-50%, -50%); opacity: 1; visibility: visible; pointer-events: auto; }
    .action-sheet { bottom: 50%; left: calc(50% + 40px); width: 540px; transform: translate(-50%, 50%) scale(0.95); border-radius: 20px; padding: 20px; opacity: 0; }
    body.sheet-open.post-sheet-active #postActionSheet { transform: translate(-50%, 50%) scale(1); opacity: 1; visibility: visible; pointer-events: auto; }
    .settings-page { width: 440px; left: calc(50% + 40px); border-left: 1px solid #e8e8e8; }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <button class="menu-btn open-settings" aria-label="Menu"><i data-lucide="menu"></i></button>
        <div class="logo">EduLink</div>
        <div class="header-placeholder"></div>
    </div>
</header>

<main>
    <article class="post">
        <div class="post-header">
            <img class="avatar" src="https://i.pravatar.cc/100?img=12" alt="">
            <div class="user">
                <div class="username">alex</div>
                <div class="date">Today at 8:32 AM</div>
            </div>
            <button class="more open-post-sheet" aria-label="More options"><i data-lucide="ellipsis-vertical"></i></button>
        </div>
        <p class="caption">A quiet morning and a fresh start. ☕</p>
        <img class="post-image" src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1000&q=90" alt="Coffee">
        
        <div class="post-bottom">
            <!-- LEFT GROUP: Like + Comment -->
            <div class="interaction-capsule">
                <button class="action like" aria-label="Like"><i data-lucide="heart"></i></button>
                <div class="liked-avatars">
                    <img src="https://i.pravatar.cc/100?img=5" alt="">
                    <img src="https://i.pravatar.cc/100?img=9" alt="">
                </div>
                <span class="capsule-count">1.2k</span>
                <div class="capsule-divider"></div>
                <!-- Comment Button inside left capsule -->
                <button class="action open-comments" aria-label="Comment"><i data-lucide="message-circle"></i></button>
                <span class="capsule-count" id="postCommentCount">48</span>
            </div>

            <!-- RIGHT GROUP: Repost + Share -->
            <div class="interaction-capsule right">
                <button class="action repost" aria-label="Repost"><i data-lucide="repeat"></i></button>
                <button class="action share" aria-label="Share"><i data-lucide="send"></i></button>
            </div>
        </div>
    </article>
</main>

<!-- SETTINGS PAGE -->
<div class="settings-page" id="settingsPage">
    <div class="settings-header">
        <button class="close-btn close-settings"><i data-lucide="chevron-left"></i></button>
        <h2>Settings</h2>
        <button class="info-btn"><i data-lucide="info"></i></button>
    </div>
    
    <div class="search-wrapper">
        <div class="solid-search">
            <i data-lucide="search"></i>
            <input type="text" placeholder="Search settings...">
        </div>
    </div>

    <div class="settings-body">
        <div class="settings-group">
            <button class="settings-btn"><i data-lucide="user"></i> Account center</button>
            <button class="settings-btn"><i data-lucide="lock"></i> Privacy</button>
            <button class="settings-btn"><i data-lucide="bell"></i> Notifications</button>
        </div>

        <div class="settings-group">
            <button class="settings-btn theme-toggle-btn" type="button">
                <i data-lucide="moon" id="themeIcon"></i> Theme
                <span class="right-slot" id="themeStatusText">Light</span>
            </button>
        </div>
    </div>
</div>

<!-- ACTION SHEETS -->
<div class="action-sheet-overlay" id="actionSheetOverlay"></div>
<div class="action-sheet" id="postActionSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-menu">
        <button class="sheet-btn"><i data-lucide="star"></i> Add to Favorites</button>
        <button class="sheet-btn"><i data-lucide="link"></i> Copy Link</button>
        <button class="sheet-btn"><i data-lucide="share-2"></i> Share to...</button>
        <button class="sheet-btn danger"><i data-lucide="flag"></i> Report</button>
    </div>
    <button class="sheet-cancel close-sheet">Cancel</button>
</div>

<!-- MAIN COMMENTS DRAWER -->
<div class="comment-overlay" id="commentOverlay"></div>
<div class="drawer-base comment-drawer" id="commentDrawer">
    <div class="drawer-header">
        <div class="drag-handle"></div>
        <h3>Comments</h3>
        <button class="header-action-btn close-drawer" id="closeDrawer" aria-label="Close"><i data-lucide="x"></i></button>
    </div>
    
    <div class="drawer-body" id="mainCommentBody">
        <div class="comment-item" data-username="sarah_j" data-text="This looks absolutely amazing! Enjoy the quiet time. ✨" data-avatar="https://i.pravatar.cc/100?img=5">
            <div class="avatar-wrapper"><img class="avatar" src="https://i.pravatar.cc/100?img=5" alt=""><div class="thread-line"></div></div>
            <div class="comment-content">
                <div class="comment-top">
                    <div class="comment-top-left"><span class="username">sarah_j</span><span class="time">2h</span></div>
                </div>
                <p class="comment-text">This looks absolutely amazing! Enjoy the quiet time. ✨</p>
                <div class="comment-action-row">
                    <div class="comment-capsule">
                        <button class="action like"><i data-lucide="heart"></i><span class="comment-count">48</span></button>
                        <button class="reply-action-btn open-reply-target" data-username="sarah_j" data-text="This looks absolutely amazing! Enjoy the quiet time. ✨" data-avatar="https://i.pravatar.cc/100?img=5">
                            <i data-lucide="corner-up-left"></i>
                            <span>Reply</span>
                        </button>
                    </div>
                </div>
                <button class="view-replies-btn open-reply-target" data-username="sarah_j" data-text="This looks absolutely amazing! Enjoy the quiet time. ✨" data-avatar="https://i.pravatar.cc/100?img=5">
                    <div class="reply-avatars"><img src="https://i.pravatar.cc/100?img=11" alt=""><img src="https://i.pravatar.cc/100?img=44" alt=""></div>
                    — View 2 replies
                </button>
            </div>
        </div>
    </div>
    
    <div class="drawer-footer">
        <img class="avatar" src="https://i.pravatar.cc/100?img=33" alt="">
        <input type="text" placeholder="Add a comment..." class="comment-input" id="mainCommentInput">
        <button class="send-comment" id="sendMainComment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<!-- REPLIES DRAWER -->
<div class="drawer-base replies-drawer" id="repliesDrawer">
    <div class="drawer-header">
        <button class="header-action-btn back-drawer" id="backToComments" aria-label="Back"><i data-lucide="chevron-left"></i></button>
        <div class="drag-handle"></div>
        <h3>Replies</h3>
    </div>
    <div class="drawer-body" id="replyCommentBody">
        <div class="comment-item parent-comment" id="targetParentComment">
            <div class="avatar-wrapper"><img class="avatar" id="parentAvatar" src="https://i.pravatar.cc/100?img=5" alt=""><div class="thread-line"></div></div>
            <div class="comment-content">
                <div class="comment-top">
                    <div class="comment-top-left"><span class="username" id="parentUsername">sarah_j</span><span class="time">2h</span></div>
                </div>
                <p class="comment-text" id="parentText">This looks absolutely amazing! Enjoy the quiet time. ✨</p>
            </div>
        </div>
    </div>
    <div class="drawer-footer">
        <img class="avatar" src="https://i.pravatar.cc/100?img=33" alt="">
        <input type="text" placeholder="Reply to sarah_j..." class="comment-input" id="replyInput">
        <button class="send-comment" id="sendReplyComment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<!-- NAVS -->
<nav class="mobile-nav">
    <button class="nav-icon active"><i data-lucide="home"></i></button>
    <button class="nav-icon"><i data-lucide="search"></i></button>
    <button class="nav-icon"><i data-lucide="plus-square"></i></button>
    <button class="nav-icon"><i data-lucide="layout-dashboard"></i></button>
</nav>

<script>
lucide.createIcons();

// Theme Switcher
const themeToggleButton = document.querySelector('.theme-toggle-btn');
const themeStatusText = document.getElementById('themeStatusText');
let dark = localStorage.getItem('social-theme') === 'dark';

function updateTheme() {
    document.documentElement.classList.toggle('dark', dark);
    if (themeStatusText) {
        themeStatusText.textContent = dark ? 'Dark' : 'Light';
        document.getElementById('themeIcon').setAttribute('data-lucide', dark ? 'sun' : 'moon');
        lucide.createIcons();
    }
    localStorage.setItem('social-theme', dark ? 'dark' : 'light');
}

themeToggleButton.addEventListener('click', () => { dark = !dark; updateTheme(); });
updateTheme();

// Likes and Reposts
document.body.addEventListener('click', (e) => {
    const likeBtn = e.target.closest('.like');
    if (likeBtn) likeBtn.classList.toggle('liked');

    const repostBtn = e.target.closest('.repost');
    if (repostBtn) repostBtn.classList.toggle('reposted');
});

// Total Comment Count Sync
let totalCommentCount = 48;
function incrementCommentCount() {
    totalCommentCount++;
    document.getElementById('postCommentCount').textContent = totalCommentCount;
}

// Create Comment Component
function createCommentHTML(text, username = "you", userAvatar = "https://i.pravatar.cc/100?img=33") {
    return `
        <div class="comment-item" data-username="${username}" data-text="${text}" data-avatar="${userAvatar}">
            <div class="avatar-wrapper"><img class="avatar" src="${userAvatar}" alt=""><div class="thread-line"></div></div>
            <div class="comment-content">
                <div class="comment-top">
                    <div class="comment-top-left"><span class="username">${username}</span><span class="time">Just now</span></div>
                </div>
                <p class="comment-text">${text}</p>
                <div class="comment-action-row">
                    <div class="comment-capsule">
                        <button class="action like"><i data-lucide="heart"></i><span class="comment-count">0</span></button>
                        <button class="reply-action-btn open-reply-target" data-username="${username}" data-text="${text}" data-avatar="${userAvatar}">
                            <i data-lucide="corner-up-left"></i>
                            <span>Reply</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// Drawer Open / Focus Direct Handling
function openComments() {
    document.body.classList.add('drawer-open');
    document.body.style.overflow = 'hidden';
    const mainInput = document.getElementById('mainCommentInput');
    // Immediate direct focus on touch gesture start
    mainInput.focus();
}

function closeComments() {
    document.body.classList.remove('drawer-open', 'replies-open');
    document.body.style.overflow = '';
}

function openReplies() {
    document.body.classList.add('replies-open');
    const replyInput = document.getElementById('replyInput');
    // Immediate focus to pop keyboard immediately on tap
    replyInput.focus();
}

function closeReplies() {
    document.body.classList.remove('replies-open');
    document.getElementById('mainCommentInput').focus();
}

document.querySelectorAll('.open-comments').forEach(btn => btn.addEventListener('click', openComments));
document.getElementById('closeDrawer').addEventListener('click', closeComments);
document.getElementById('commentOverlay').addEventListener('click', closeComments);
document.getElementById('backToComments').addEventListener('click', closeReplies);

// Tapping any Comment or Reply button directly opens/activates reply mode and focuses input
document.body.addEventListener('click', (e) => {
    const replyTrigger = e.target.closest('.open-reply-target');
    const commentItem = e.target.closest('.comment-item');
    
    // Ignore direct clicks on like buttons or reply buttons inside
    if (e.target.closest('.like')) return;

    if (replyTrigger || (commentItem && !commentItem.classList.contains('parent-comment'))) {
        const target = replyTrigger || commentItem;
        const username = target.getAttribute('data-username') || 'user';
        const text = target.getAttribute('data-text') || target.querySelector('.comment-text')?.textContent || '';
        const avatar = target.getAttribute('data-avatar') || target.querySelector('.avatar')?.src || 'https://i.pravatar.cc/100?img=5';

        document.getElementById('parentUsername').textContent = username;
        document.getElementById('parentText').textContent = text;
        document.getElementById('parentAvatar').src = avatar;
        
        const replyInput = document.getElementById('replyInput');
        replyInput.placeholder = `Reply to ${username}...`;

        openReplies();
    }
});

// Post Comment Handlers
function submitMainComment() {
    const input = document.getElementById('mainCommentInput');
    const container = document.getElementById('mainCommentBody');
    const text = input.value.trim();
    
    if (text !== '') {
        container.insertAdjacentHTML('beforeend', createCommentHTML(text));
        input.value = '';
        incrementCommentCount();
        lucide.createIcons();
        container.scrollTop = container.scrollHeight;
    }
}

function submitReplyComment() {
    const input = document.getElementById('replyInput');
    const container = document.getElementById('replyCommentBody');
    const text = input.value.trim();
    
    if (text !== '') {
        container.insertAdjacentHTML('beforeend', createCommentHTML(text));
        input.value = '';
        incrementCommentCount();
        lucide.createIcons();
        container.scrollTop = container.scrollHeight;
    }
}

document.getElementById('sendMainComment').addEventListener('click', submitMainComment);
document.getElementById('mainCommentInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') submitMainComment(); });

document.getElementById('sendReplyComment').addEventListener('click', submitReplyComment);
document.getElementById('replyInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') submitReplyComment(); });

// Settings Modal Open/Close
document.querySelectorAll('.open-settings').forEach(btn => btn.addEventListener('click', () => {
    document.body.classList.add('settings-active');
}));
document.querySelectorAll('.close-settings').forEach(btn => btn.addEventListener('click', () => {
    document.body.classList.remove('settings-active');
}));

// Action Sheets Open/Close
document.querySelectorAll('.open-post-sheet').forEach(btn => btn.addEventListener('click', () => {
    document.body.classList.add('sheet-open', 'post-sheet-active');
}));
document.querySelectorAll('.close-sheet, #actionSheetOverlay').forEach(btn => btn.addEventListener('click', () => {
    document.body.classList.remove('sheet-open', 'post-sheet-active');
}));
</script>

</body>
</html>
