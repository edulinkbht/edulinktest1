<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Instagram Navigation</title>

<!-- Modern, clean geometric font (Plus Jakarta Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #fff;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    background: #fff;
}

/* FOOTER NAV CONTAINER */
.bottom-nav {
    --side: 12px;
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: calc(76px + env(safe-area-inset-bottom));
    padding: 8px var(--side) calc(8px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    z-index: 100;
    user-select: none;
    -webkit-user-select: none;
}

/* DYNAMIC ACCENT CAPSULE */
.active-capsule {
    position: absolute;
    top: 15px;
    left: 0;
    width: 0px;
    height: 46px;
    border-radius: 50px;
    background: #f0f2f5;
    pointer-events: none;
    z-index: 0;
    will-change: left, width;
    transition: left 400ms cubic-bezier(.22,.75,.18,1), width 400ms cubic-bezier(.22,.75,.18,1);
}

/* NAV ITEMS */
.nav-item {
    position: relative;
    height: 46px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: #111;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 1;
}

.nav-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    display: none;
    color: #0f1419;
}

.nav-item.active .nav-label {
    display: inline-block;
}

/* SVG Sizing */
svg.icon-outline, svg.icon-filled {
    width: 28px;
    height: 28px;
    display: flex;
    flex-shrink: 0;
    pointer-events: none;
}

/* Default state: show outline icons */
.nav-item .icon-filled {
    display: none;
}
.nav-item .icon-outline {
    display: block; 
}

/* Active state: show filled/bold icons */
.nav-item.active .icon-filled {
    display: block;
}
.nav-item.active .icon-outline {
    display: none;
}

/* PROFILE IMAGE & BADGE CONTAINER */
.profile-container {
    position: relative;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.profile-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
}

.profile-badge {
    position: absolute;
    top: -1px;
    right: -1px;
    width: 8px;
    height: 8px;
    background-color: #ff3040;
    border-radius: 50%;
    border: 1.5px solid #fff;
    display: none;
}

.nav-item.active .profile-badge {
    display: block;
}
</style>
</head>
<body>

<main class="app">

<nav class="bottom-nav" id="bottomNav">

    <div class="active-capsule" id="activeCapsule"></div>

    <!-- HOME -->
    <button class="nav-item active">
        <!-- Outline -->
        <svg class="icon-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12.76c0-1.02 0-1.53.12-2 .1-.43.28-.83.51-1.2.27-.41.64-.76 1.38-1.46l2.6-2.45c1.54-1.46 2.32-2.19 3.2-2.47.77-.24 1.61-.24 2.38 0 .88.28 1.66 1.01 3.2 2.47l2.6 2.45c.74.7 1.11 1.05 1.38 1.46.23.37.41.77.51 1.2.12.47.12.98.12 2v3.57c0 1.09 0 1.63-.12 2.07-.32 1.21-1.27 2.16-2.47 2.48-.45.12-.99.12-2.08.12-.31 0-.46 0-.59-.04-.34-.09-.61-.36-.71-.7-.03-.13-.03-.29-.03-.6V17c0-.47 0-.7-.03-.89-.17-1.07-1.01-1.91-2.08-2.08C12.7 14 12.46 14 12 14s-.7 0-.89.03c-1.07.17-1.91 1.01-2.08 2.08C9 16.3 9 16.53 9 17v2.66c0 .31 0 .47-.03.6-.1.34-.37.61-.71.7-.13.04-.28.04-.59.04-1.09 0-1.63 0-2.08-.12-1.2-.32-2.15-1.27-2.47-2.48C3 17.96 3 17.42 3 16.33z"/>
        </svg>
        <!-- Filled Active State -->
        <svg class="icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path fill="currentColor" d="M3 12.76c0-1.02 0-1.53.12-2 .1-.43.28-.83.51-1.2.27-.41.64-.76 1.38-1.46l2.6-2.45c1.54-1.46 2.32-2.19 3.2-2.47.77-.24 1.61-.24 2.38 0 .88.28 1.66 1.01 3.2 2.47l2.6 2.45c.74.7 1.11 1.05 1.38 1.46.23.37.41.77.51 1.2.12.47.12.98.12 2v3.57c0 1.09 0 1.63-.12 2.07-.32 1.21-1.27 2.16-2.47 2.48-.45.12-.99.12-2.08.12-.31 0-.46 0-.59-.04-.34-.09-.61-.36-.71-.7-.03-.13-.03-.29-.03-.6V17c0-.47 0-.7-.03-.89-.17-1.07-1.01-1.91-2.08-2.08C12.7 14 12.46 14 12 14s-.7 0-.89.03c-1.07.17-1.91 1.01-2.08 2.08C9 16.3 9 16.53 9 17v2.66c0 .31 0 .47-.03.6-.1.34-.37.61-.71.7-.13.04-.28.04-.59.04-1.09 0-1.63 0-2.08-.12-1.2-.32-2.15-1.27-2.47-2.48C3 17.96 3 17.42 3 16.33z"/>
        </svg>
        <span class="nav-label">Home</span>
    </button>

    <!-- SEARCH -->
    <button class="nav-item">
        <!-- Outline -->
        <svg class="icon-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 11.5c0 2.35-.95 4.47-2.49 6.01S13.85 20 11.5 20C6.81 20 3 16.19 3 11.5S6.81 3 11.5 3 20 6.81 20 11.5"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-3.49-3.49"/>
        </svg>
        <!-- Bolder Active State (Standard for Search instead of filled) -->
        <svg class="icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M20 11.5c0 2.35-.95 4.47-2.49 6.01S13.85 20 11.5 20C6.81 20 3 16.19 3 11.5S6.81 3 11.5 3 20 6.81 20 11.5"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="m21 21-3.49-3.49"/>
        </svg>
        <span class="nav-label">Search</span>
    </button>

    <!-- CREATE -->
    <button class="nav-item">
        <!-- Outline -->
        <svg class="icon-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v-3m0 0V9m0 3H9m3 0h3m-3 9c-2.8 0-4.19 0-5.3-.46-1.47-.61-2.63-1.77-3.24-3.24C3 16.19 3 14.8 3 12s0-4.19.46-5.3c.61-1.47 1.77-2.63 3.24-3.24C7.81 3 9.2 3 12 3s4.19 0 5.3.46c1.47.61 2.63 1.77 3.24 3.24C21 7.81 21 9.2 21 12s0 4.19-.46 5.3c-.61 1.47-1.77 2.63-3.24 3.24-1.11.46-2.5.46-5.3.46"/>
        </svg>
        <!-- Filled Active State (Box is filled, Plus is punched out in white) -->
        <svg class="icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path fill="currentColor" d="M12 21c-2.8 0-4.19 0-5.3-.46-1.47-.61-2.63-1.77-3.24-3.24C3 16.19 3 14.8 3 12s0-4.19.46-5.3c.61-1.47 1.77-2.63 3.24-3.24C7.81 3 9.2 3 12 3s4.19 0 5.3.46c1.47.61 2.63 1.77 3.24 3.24C21 7.81 21 9.2 21 12s0 4.19-.46 5.3c-.61 1.47-1.77 2.63-3.24 3.24-1.11.46-2.5.46-5.3.46"/>
            <path stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v-6m-3 3h6"/>
        </svg>
        <span class="nav-label">Create</span>
    </button>

    <!-- CHAT -->
    <button class="nav-item">
        <!-- Outline -->
        <svg class="icon-outline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9c0 .43.03.86.09 1.27.17 1.21.25 1.81.27 1.97.02.25.01.16.01.42 0 .16-.01.34-.04.7l-.15 2.15c-.06.86-.09 1.29.06 1.61.13.28.36.51.64.64.32.15.75.12 1.61.06l2.15-.15c.36-.03.54-.04.7-.04.26 0 .17-.01.42.01.16.02.76.1 1.97.27.41.06.84.09 1.27.09"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h8m-8 4h4"/>
        </svg>
        <!-- Filled Active State (Bubble filled, lines punched out in white) -->
        <svg class="icon-filled" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path fill="currentColor" d="M12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9-9 4.03-9 9c0 .43.03.86.09 1.27.17 1.21.25 1.81.27 1.97.02.25.01.16.01.42 0 .16-.01.34-.04.7l-.15 2.15c-.06.86-.09 1.29.06 1.61.13.28.36.51.64.64.32.15.75.12 1.61.06l2.15-.15c.36-.03.54-.04.7-.04.26 0 .17-.01.42.01.16.02.76.1 1.97.27.41.06.84.09 1.27.09"/>
            <path stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 10h8m-8 4h4"/>
        </svg>
        <span class="nav-label">Chat</span>
    </button>

    <!-- PROFILE -->
    <button class="nav-item">
        <div class="profile-container">
            <img class="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Profile avatar">
            <span class="profile-badge"></span>
        </div>
        <span class="nav-label">Profile</span>
    </button>

</nav>

</main>

<script>
const nav = document.getElementById("bottomNav");
const capsule = document.getElementById("activeCapsule");
const items = [...document.querySelectorAll(".nav-item")];

let activeIndex = 0;

function updateActive(index) {
    activeIndex = Math.max(0, Math.min(items.length - 1, index));
    items.forEach((item, i) => {
        item.classList.toggle("active", i === activeIndex);
    });
}

function updateCapsulePosition() {
    const activeItem = items[activeIndex];
    if (!activeItem) return;
    const navRect = nav.getBoundingClientRect();
    const itemRect = activeItem.getBoundingClientRect();
    capsule.style.left = (itemRect.left - navRect.left) + "px";
    capsule.style.width = itemRect.width + "px";
}

items.forEach((item, index) => {
    item.addEventListener("click", () => {
        updateActive(index);
        updateCapsulePosition();
    });
});

window.addEventListener("resize", updateCapsulePosition);
updateActive(0);
updateCapsulePosition();
</script>

</body>
</html>
