
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Instagram Navigation</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #fff;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    background: #fff;
}

/* FOOTER */

.bottom-nav {
    --side: 8px;

    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 430px;

    height: calc(76px + env(safe-area-inset-bottom));

    padding: 8px var(--side)
        calc(8px + env(safe-area-inset-bottom));

    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: center;

    background: #fff;
    border: none;
    box-shadow: none;

    z-index: 100;

    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
}

/* SIMPLE GRAY CAPSULE */

.active-capsule {
    position: absolute;

    top: 15px;
    left: 0;

    width: 68px;
    height: 46px;

    border-radius: 50px;

    background: #ededf0;

    transform: translateX(-50%);

    pointer-events: none;
    z-index: 0;

    will-change: left;

    transition:
        left 480ms cubic-bezier(.22,.75,.18,1);
}

.bottom-nav.dragging .active-capsule {
    transition: none;
}

/* NAV ITEMS */

.nav-item {
    position: relative;

    width: 100%;
    min-width: 0;
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    outline: none;
    background: transparent;

    color: #111;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    z-index: 1;
}

/* ICONS */

.nav-item svg {
    display: block;

    width: 32px;
    height: 32px;

    flex-shrink: 0;
    overflow: visible;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;

    pointer-events: none;
}

/* HOME */

.home-filled {
    display: none;
    fill: currentColor;
    stroke: none;
}

.home-outline {
    display: block;
}

.nav-item.active .home-filled {
    display: block;
}

.nav-item.active .home-outline {
    display: none;
}

/* CHAT */

.chat-icon {
    overflow: visible;
}

/* SUBTLE FEEDBACK */

.nav-item:active {
    opacity: .78;
}

.nav-item:focus-visible {
    outline: 2px solid #888;
    outline-offset: 2px;
    border-radius: 12px;
}

@media (prefers-reduced-motion: reduce) {
    .active-capsule {
        transition: none;
    }
}
</style>
</head>

<body>

<main class="app">

<nav class="bottom-nav" id="bottomNav"
     aria-label="Main navigation">

    <div class="active-capsule" id="activeCapsule"></div>

    <!-- HOME -->
    <button class="nav-item active"
            aria-label="Home"
            aria-current="page">

        <svg viewBox="0 0 24 24">

            <path class="home-filled"
                d="M21.7 10.2 13.3 2.7a2 2 0 0 0-2.6 0L2.3 10.2a1.8 1.8 0 0 0-.3 2.5l1.1 1.2V19a3 3 0 0 0 3 3h3.1v-6.2a2.8 2.8 0 0 1 5.6 0V22H18a3 3 0 0 0 3-3v-5.1l1.1-1.2a1.8 1.8 0 0 0-.4-2.5Z"/>

            <path class="home-outline"
                d="M2.5 10.7 12 2.8l9.5 7.9M4.5 9.5V19a2 2 0 0 0 2 2h3.2v-5.8a2.3 2.3 0 0 1 4.6 0V21h3.2a2 2 0 0 0 2-2V9.5"/>
        </svg>
    </button>

    <!-- SEARCH -->
    <button class="nav-item" aria-label="Search">
        <svg viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="7.2"/>
            <path d="M16 16l5 5"/>
        </svg>
    </button>

    <!-- CREATE -->
    <button class="nav-item" aria-label="Create">
        <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <path d="M12 7.5v9"/>
            <path d="M7.5 12h9"/>
        </svg>
    </button>

    <!-- CHAT -->
    <button class="nav-item" aria-label="Messages">
        <svg class="chat-icon" viewBox="0 0 28 28">
            <path d="
                M14 3.5
                C8.2 3.5 3.5 7.7 3.5 13
                C3.5 16.1 5.1 18.8 7.7 20.5
                L7 24
                L12 21.9
                C12.7 22 13.3 22.1 14 22.1
                C19.8 22.1 24.5 17.9 24.5 12.8
                C24.5 7.6 19.8 3.5 14 3.5Z
            "/>
        </svg>
    </button>

    <!-- PROFILE -->
    <button class="nav-item" aria-label="Profile">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="9" r="3.2"/>
            <path d="M5.5 19a6.5 6.5 0 0 1 13 0"/>
        </svg>
    </button>

</nav>

</main>

<script>
const nav = document.getElementById("bottomNav");
const capsule = document.getElementById("activeCapsule");
const items = [...document.querySelectorAll(".nav-item")];

const SIDE = 8;
const DRAG_THRESHOLD = 20;

let activeIndex = 0;
let startX = 0;
let startY = 0;

let tracking = false;
let dragging = false;
let verticalGesture = false;
let suppressClick = false;

let pointerId = null;

let currentX = 0;
let targetX = 0;
let animationFrame = null;

function getCellWidth() {
    return (nav.clientWidth - SIDE * 2) / items.length;
}

function getCenter(index) {
    return SIDE + getCellWidth() * (index + .5);
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function updateActive(index) {

    activeIndex = clamp(index, 0, items.length - 1);

    items.forEach((item, i) => {
        const selected = i === activeIndex;

        item.classList.toggle("active", selected);

        if (selected) {
            item.setAttribute("aria-current", "page");
        } else {
            item.removeAttribute("aria-current");
        }
    });
}

function moveTo(index) {

    updateActive(index);

    const position = getCenter(activeIndex);

    currentX = position;
    targetX = position;

    capsule.style.left = position + "px";
}

function followFinger(position) {

    targetX = clamp(
        position,
        getCenter(0),
        getCenter(items.length - 1)
    );

    if (animationFrame) return;

    function animate() {

        const difference = targetX - currentX;

        currentX += difference * .20;

        if (Math.abs(difference) < .12) {
            currentX = targetX;
            capsule.style.left = currentX + "px";
            animationFrame = null;
            return;
        }

        capsule.style.left = currentX + "px";

        animationFrame = requestAnimationFrame(animate);
    }

    animationFrame = requestAnimationFrame(animate);
}

function stopFollowing() {
    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }
}

/* POINTER DOWN */

nav.addEventListener("pointerdown", event => {

    if (event.button !== undefined && event.button !== 0) return;

    tracking = true;
    dragging = false;
    verticalGesture = false;

    pointerId = event.pointerId;

    startX = event.clientX;
    startY = event.clientY;

    suppressClick = false;
});

/* INTENTIONAL DRAG */

nav.addEventListener("pointermove", event => {

    if (!tracking || event.pointerId !== pointerId) return;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    const horizontal = Math.abs(dx);
    const vertical = Math.abs(dy);

    if (!dragging && vertical > 12 && vertical > horizontal) {
        verticalGesture = true;
        return;
    }

    if (verticalGesture) return;

    if (!dragging) {

        if (horizontal < DRAG_THRESHOLD) return;
        if (horizontal < vertical * 1.5) return;

        dragging = true;
        suppressClick = true;

        nav.classList.add("dragging");
    }

    const rect = nav.getBoundingClientRect();

    followFinger(event.clientX - rect.left);
});

/* RELEASE AND SNAP */

function finishGesture(event) {

    if (!tracking || event.pointerId !== pointerId) return;

    tracking = false;

    if (dragging) {

        dragging = false;
        nav.classList.remove("dragging");

        stopFollowing();

        const position = targetX;
        let destination = activeIndex;

        for (let i = 0; i < items.length; i++) {

            const midpoint = getCenter(i);

            if (i > 0) {
                const boundary =
                    (getCenter(i - 1) + midpoint) / 2;

                if (position >= boundary) {
                    destination = i;
                }
            }
        }

        updateActive(destination);

        const finalPosition = getCenter(destination);

        currentX = finalPosition;
        targetX = finalPosition;

        capsule.style.left = finalPosition + "px";
    }

    pointerId = null;
}

/* POINTER EVENTS */

nav.addEventListener("pointerup", finishGesture);
nav.addEventListener("pointercancel", finishGesture);

/* CLICK */

items.forEach((item, index) => {

    item.addEventListener("click", event => {

        if (suppressClick) {
            event.preventDefault();
            event.stopPropagation();
            suppressClick = false;
            return;
        }

        moveTo(index);
    });
});

/* RESIZE */

window.addEventListener("resize", () => {
    if (!tracking) moveTo(activeIndex);
});

/* INITIAL POSITION */

moveTo(0);

</script>

</body>
</html>
