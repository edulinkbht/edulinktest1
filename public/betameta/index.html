<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Instagram Navigation</title>

<!-- Modern, clean geometric font (Plus Jakarta Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

<!-- Iconify Web Component Script -->
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #fff;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    background: #fff;
}

/* FOOTER NAV CONTAINER */

.bottom-nav {
    --side: 12px;

    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 430px;

    height: calc(76px + env(safe-area-inset-bottom));

    padding: 8px var(--side) calc(8px + env(safe-area-inset-bottom));

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;
    border: none;
    box-shadow: none;

    z-index: 100;

    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
}

/* DYNAMIC ACCENT CAPSULE */

.active-capsule {
    position: absolute;
    top: 15px;
    left: 0;

    width: 0px;
    height: 46px;

    border-radius: 50px;
    background: #f0f2f5;

    pointer-events: none;
    z-index: 0;

    will-change: left, width;
    transition: 
        left 400ms cubic-bezier(.22,.75,.18,1),
        width 400ms cubic-bezier(.22,.75,.18,1);
}

.bottom-nav.dragging .active-capsule {
    transition: none;
}

/* NAV ITEMS */

.nav-item {
    position: relative;

    height: 46px;
    padding: 0 12px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    border: none;
    outline: none;
    background: transparent;

    color: #111;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;

    z-index: 1;
    transition: color 250ms ease;
}

/* NAV LABEL */

.nav-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    white-space: nowrap;
    display: none;
    color: #0f1419;
}

.nav-item.active .nav-label {
    display: inline-block;
}

/* ICONIFY ICON STYLING (Thicker global strokes) */

iconify-icon {
    font-size: 26px;
    width: 26px;
    height: 26px;
    display: block;
    flex-shrink: 0;
    pointer-events: none;
    
    /* This physically adds thickness to ALL icons */
    stroke: currentColor;
    stroke-width: 0.8px;
}

/* Default state: show outline icons */
.nav-item .icon-filled {
    display: none;
}
.nav-item .icon-outline {
    display: block;
}

/* Active state: show filled icons if available */
.nav-item.active .icon-filled {
    display: block;
}
.nav-item.active .icon-outline {
    display: none;
}

/* PROFILE IMAGE & BADGE CONTAINER */

.profile-container {
    position: relative;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.profile-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.profile-badge {
    position: absolute;
    top: -1px;
    right: -1px;
    width: 8px;
    height: 8px;
    background-color: #ff3040;
    border-radius: 50%;
    border: 1.5px solid #fff;
    display: none;
}

.nav-item.active .profile-badge {
    display: block;
}

/* FEEDBACK & ACCESSIBILITY */

.nav-item:active {
    opacity: .78;
}

.nav-item:focus-visible {
    outline: 2px solid #888;
    outline-offset: 2px;
    border-radius: 24px;
}

@media (prefers-reduced-motion: reduce) {
    .active-capsule {
        transition: none;
    }
}
</style>
</head>

<body>

<main class="app">

<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">

    <div class="active-capsule" id="activeCapsule"></div>

    <!-- HOME -->
    <button class="nav-item active" aria-label="Home" aria-current="page">
        <iconify-icon class="icon-outline" icon="solar:home-2-linear"></iconify-icon>
        <iconify-icon class="icon-filled" icon="solar:home-2-bold"></iconify-icon>
        <span class="nav-label">Home</span>
    </button>

    <!-- SEARCH -->
    <button class="nav-item" aria-label="Search">
        <iconify-icon class="icon-outline" icon="solar:magnifer-linear"></iconify-icon>
        <!-- Ramped up to 2px so it gets noticeably bolder when active -->
        <iconify-icon class="icon-filled" icon="solar:magnifer-linear" style="stroke-width: 2px;"></iconify-icon>
        <span class="nav-label">Search</span>
    </button>

    <!-- CREATE -->
    <button class="nav-item" aria-label="Create">
        <iconify-icon class="icon-outline" icon="solar:add-square-linear"></iconify-icon>
        <iconify-icon class="icon-filled" icon="solar:add-square-bold"></iconify-icon>
        <span class="nav-label">Create</span>
    </button>

    <!-- CHAT -->
    <button class="nav-item" aria-label="Messages">
        <iconify-icon class="icon-outline" icon="solar:chat-round-line-linear"></iconify-icon>
        <iconify-icon class="icon-filled" icon="solar:chat-round-line-bold"></iconify-icon>
        <span class="nav-label">Chat</span>
    </button>

    <!-- PROFILE -->
    <button class="nav-item" aria-label="Profile">
        <div class="profile-container">
            <img class="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Profile avatar">
            <span class="profile-badge"></span>
        </div>
        <span class="nav-label">Profile</span>
    </button>

</nav>

</main>

<script>
const nav = document.getElementById("bottomNav");
const capsule = document.getElementById("activeCapsule");
const items = [...document.querySelectorAll(".nav-item")];

let activeIndex = 0;

function updateActive(index) {
    activeIndex = Math.max(0, Math.min(items.length - 1, index));

    items.forEach((item, i) => {
        const selected = i === activeIndex;
        item.classList.toggle("active", selected);

        if (selected) {
            item.setAttribute("aria-current", "page");
        } else {
            item.removeAttribute("aria-current");
        }
    });
}

function updateCapsulePosition() {
    const activeItem = items[activeIndex];
    if (!activeItem) return;

    const navRect = nav.getBoundingClientRect();
    const itemRect = activeItem.getBoundingClientRect();

    const left = itemRect.left - navRect.left;
    const width = itemRect.width;

    capsule.style.left = left + "px";
    capsule.style.width = width + "px";
}

function moveTo(index) {
    updateActive(index);
    updateCapsulePosition();
}

items.forEach((item, index) => {
    item.addEventListener("click", () => {
        moveTo(index);
    });
});

window.addEventListener("resize", () => {
    updateCapsulePosition();
});

// Initialize active state and capsule sizing
moveTo(0);

</script>

</body>
</html>
