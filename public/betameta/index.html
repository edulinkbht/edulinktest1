<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Instagram Navigation</title>

<!-- Modern, clean geometric font (Plus Jakarta Sans) & Playfair Display for the serif text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
/* ================================
   GLOBAL RESET & SCROLLBAR HIDING
   ================================ */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
}

/* Hide scrollbar for Chrome, Safari and Opera */
::-webkit-scrollbar {
    display: none;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #fff;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    background: #fff;
    position: relative;
}

/* ================================
   HOME HEADER (VISIBLE ON TAB 0)
   ================================ */
.top-header {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: calc(60px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    z-index: 100;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 8px; 
}

.brand-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
}

.brand-name {
    font-size: 25px; 
    font-weight: 800; 
    letter-spacing: -0.8px; 
    color: #000;
    margin-top: 2px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-btn {
    background: transparent;
    border: none;
    color: #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
}

/* ================================
   SEARCH HEADER (VISIBLE ON TAB 1)
   ================================ */
.search-header-container {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: #fff;
    z-index: 100;
    display: none; /* Hidden by default */
}

.search-top-row {
    display: flex;
    align-items: center;
    /* Aligned exactly with the Home Header's dimensions */
    height: calc(60px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    gap: 12px;
}

.search-box {
    flex: 1;
    display: flex;
    align-items: center;
    background: #f0f2f5;
    height: 44px;
    border-radius: 22px;
    padding: 0 16px;
    gap: 10px;
}

.search-box svg.search-icon {
    color: #111;
    width: 20px;
    height: 20px;
}

.search-box input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #111;
}

.search-box input::placeholder {
    color: #8e8e93;
    font-weight: 500;
}

.search-divider {
    width: 1px;
    height: 20px;
    background: #d1d1d6;
    margin: 0 2px;
}

.search-box svg.camera-icon {
    color: #111;
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.search-categories {
    display: flex;
    gap: 8px;
    padding: 8px 12px 12px;
    overflow-x: auto;
}

.category-pill {
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 600;
    border: none;
    white-space: nowrap;
    cursor: pointer;
    background: #f0f2f5;
    color: #111;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
}

.category-pill.active {
    background: #111;
    color: #fff;
}

/* ================================
   CONTENT VIEWS
   ================================ */
.view-content {
    display: none;
}

.view-content.active {
    display: block;
}

#homeContent {
    padding-top: calc(60px + env(safe-area-inset-top));
}

#searchContent {
    padding-top: calc(115px + env(safe-area-inset-top)); 
    padding-left: 12px;
    padding-right: 12px;
    padding-bottom: calc(85px + env(safe-area-inset-bottom));
}

/* Masonry Grid */
.masonry-grid {
    column-count: 2;
    column-gap: 12px;
}

.masonry-item {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: #f0f2f5;
}

.masonry-item img {
    width: 100%;
    display: block;
    object-fit: cover;
}

.masonry-item.text-block {
    background: #d0cece;
    aspect-ratio: 1 / 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
}

.masonry-item.text-block span {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    color: #111;
    line-height: 1.3;
}

.dots-icon {
    position: absolute;
    bottom: 12px;
    right: 12px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
}


/* ================================
   FOOTER NAV CONTAINER
   ================================ */
.bottom-nav {
    --side: 12px;
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: calc(76px + env(safe-area-inset-bottom));
    padding: 8px var(--side) calc(8px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    z-index: 100;
    user-select: none;
    -webkit-user-select: none;
}

/* DYNAMIC ACCENT CAPSULE */
.active-capsule {
    position: absolute;
    top: 15px;
    left: 0;
    width: 0px;
    height: 46px;
    border-radius: 50px;
    background: #f0f2f5;
    pointer-events: none;
    z-index: 0;
    will-change: left, width;
    transition: left 400ms cubic-bezier(.22,.75,.18,1), width 400ms cubic-bezier(.22,.75,.18,1);
}

/* NAV ITEMS */
.nav-item {
    position: relative;
    height: 46px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: #111;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 1;
}

.nav-label {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    display: none;
    color: #0f1419;
}

.nav-item.active .nav-label {
    display: inline-block;
}

/* SVG Sizing */
svg.icon-outline, svg.icon-filled {
    width: 28px;
    height: 28px;
    display: flex;
    flex-shrink: 0;
    pointer-events: none;
}

/* Default state: show outline icons */
.nav-item .icon-filled {
    display: none;
}
.nav-item .icon-outline {
    display: block; 
}

/* Active state: show filled/bold icons */
.nav-item.active .icon-filled {
    display: block;
}
.nav-item.active .icon-outline {
    display: none;
}

/* PROFILE IMAGE & BADGE */
.profile-container {
    position: relative;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.profile-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
}

.profile-badge {
    position: absolute;
    top: -1px;
    right: -1px;
    width: 8px;
    height: 8px;
    background-color: #ff3040;
    border-radius: 50%;
    border: 1.5px solid #fff;
    display: none;
}

.nav-item.active .profile-badge {
    display: block;
}
</style>
</head>

<script>
const nav = document.getElementById("bottomNav");
const capsule = document.getElementById("activeCapsule");
const items = [...document.querySelectorAll(".nav-item")];

const homeHeader = document.getElementById("homeHeader");
const searchHeader = document.getElementById("searchHeader");
const homeContent = document.getElementById("homeContent");
const searchContent = document.getElementById("searchContent");

let activeIndex = 0;

function updateActive(index) {
    activeIndex = Math.max(0, Math.min(items.length - 1, index));
    
    items.forEach((item, i) => {
        item.classList.toggle("active", i === activeIndex);
    });
    
    if (activeIndex === 0) { 
        homeHeader.style.display = "flex";
        searchHeader.style.display = "none";
        homeContent.classList.add("active");
        searchContent.classList.remove("active");
    } 
    else if (activeIndex === 1) { 
        homeHeader.style.display = "none";
        searchHeader.style.display = "block";
        homeContent.classList.remove("active");
        searchContent.classList.add("active");
    }
}

function updateCapsulePosition() {
    const activeItem = items[activeIndex];
    if (!activeItem) return;
    const navRect = nav.getBoundingClientRect();
    const itemRect = activeItem.getBoundingClientRect();
    capsule.style.left = (itemRect.left - navRect.left) + "px";
    capsule.style.width = itemRect.width + "px";
}

items.forEach((item, index) => {
    item.addEventListener("click", () => {
        updateActive(index);
        updateCapsulePosition();
    });
});

window.addEventListener("resize", updateCapsulePosition);
updateActive(0);
updateCapsulePosition();
</script>

</body>
</html>
