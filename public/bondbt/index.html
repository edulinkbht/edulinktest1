<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Feed</title>

  <!-- Google Fonts: Outfit (UI) & Grand Hotel (Instagram-style brand text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Iconify Library for Solar Icons -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <style>
    /* CSS Variables for Light / Dark Themes */
    :root[data-theme="dark"] {
      --bg-color: #0a0a0a; 
      --nav-bg: #0a0a0a;   
      --icon-color: #f5f5f5;
      --hover-bg: #1a1a1a;
      --active-bg: #242424;
      --active-ring: #ffffff;
      --menu-bg: #242424;
      --menu-hover: #303030;
      --menu-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0, 0, 0, 0.4);
      --capsule-bg: #242424;
      --capsule-border: rgba(255, 255, 255, 0.12);
      --divider-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f5f5f5;
      --text-secondary: #90909a;
      --like-color: #ff3040;
      --follow-bg: #2a2a2a; 
      --follow-hover: #3a3a3a;
      --follow-text: #ffffff;
    }

    :root[data-theme="light"] {
      --bg-color: #ffffff;
      --nav-bg: #ffffff;
      --icon-color: #000000;
      --hover-bg: #f5f5f7;
      --active-bg: #f3f4f6;
      --active-ring: #000000;
      --menu-bg: #ffffff;
      --menu-hover: #f5f5f7;
      --menu-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 4px 14px rgba(0, 0, 0, 0.08);
      --capsule-bg: #ffffff;
      --capsule-border: #e5e7eb;
      --divider-color: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --like-color: #ff3040;
      --follow-bg: #3897f0; 
      --follow-hover: #2b80d5;
      --follow-text: #ffffff;
    }

    /* Reset & Hide Scrollbar globally */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    /* Synchronized Theme Transitions */
    body, 
    .nav-wrapper, 
    .nav-item, 
    .post-card, 
    .action-capsule, 
    .menu-popup, 
    .action-btn,
    .post-more-btn,
    .right-sidebar-capsule,
    .icon-only-btn,
    .mobile-header,
    .post-follow-btn {
      transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.2s ease,
                  transform 0.2s ease,
                  visibility 0.2s;
    }

    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body.no-scroll {
      overflow: hidden;
      touch-action: none;
    }

    /* APP LAYOUT & NAVIGATION */
    .app-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 1500;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s;
    }
    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-header { display: none; }
    .desktop-brand-logo { display: none; }

    /* Floating Fade Mask (Hidden on Mobile) */
    .bottom-fade-mask {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 160px;
      background: linear-gradient(to top, var(--bg-color) 10%, transparent);
      pointer-events: none;
      z-index: 900;
    }

    .nav-wrapper {
      position: fixed;
      z-index: 1000;
      background-color: var(--nav-bg);
      border: none !important;
      box-shadow: none !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--icon-color);
      text-decoration: none;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-item iconify-icon {
      font-size: 28px;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .nav-item:active iconify-icon { transform: scale(0.92); }

    .nav-text {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
    }

    .nav-item.active .nav-text {
      font-weight: 700;
    }

    .profile-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid transparent;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .nav-item.active .profile-avatar { border-color: var(--active-ring); transform: scale(1.08); }

    /* Badge */
    .icon-badge-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .notification-badge {
      position: absolute;
      top: -3px;
      right: -5px;
      background-color: var(--like-color);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      line-height: 1;
      border: 2px solid var(--bg-color);
    }

    /* MAIN CONTENT AREA & FEED POSTS */
    .main-content-wrapper {
      flex: 1;
      display: flex;
      width: 100%;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .middle-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .post-card {
      width: 100%;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: none !important;
    }
    .post-header { display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 12px 16px; }
    .post-author-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .post-author-left { display: flex; align-items: center; gap: 12px; }
    .author-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .author-details { display: flex; flex-direction: column; gap: 2px; }
    .author-name { font-size: 15px; font-weight: 700; color: var(--text-primary); text-decoration: none; line-height: 1.2; }
    .post-date { font-size: 12px; color: var(--text-secondary); font-weight: 400; }
    .post-caption { font-size: 15px; font-weight: 400; line-height: 1.5; color: var(--text-primary); padding: 0; }

    /* Follow & Post Actions */
    .post-header-actions { display: flex; align-items: center; gap: 10px; }
    
    .post-follow-btn {
      background-color: var(--follow-bg); color: var(--follow-text); border: 1px solid transparent; 
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; height: 36px; padding: 0 18px;
      border-radius: 10px; box-shadow: none !important; display: inline-flex; align-items: center; justify-content: center;
    }
    .post-follow-btn:hover { background-color: var(--follow-hover); }
    .post-follow-btn.following { background-color: transparent; color: var(--text-primary); border: 1px solid var(--divider-color); }
    .post-follow-btn.following:hover { background-color: var(--hover-bg); }

    .post-more-wrapper { position: relative; display: flex; }
    .post-more-btn {
      background: transparent !important; border: none; color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 50%;
    }
    .post-more-btn:hover { background-color: var(--hover-bg) !important; }
    .post-more-btn:active { opacity: 0.8; }
    .post-more-btn iconify-icon { font-size: 28px; }

    /* Post Menu Popup - OUTSIDE THE POST CARD with SHADOW RESTORED */
    .post-menu-popup {
      position: absolute; 
      top: 0; 
      left: calc(100% + 12px); 
      right: auto;
      width: 220px; 
      background-color: var(--menu-bg);
      border-radius: 16px; 
      padding: 8px; 
      box-shadow: var(--menu-shadow) !important; 
      display: flex;
      flex-direction: column; 
      gap: 2px; 
      z-index: 500; 
      opacity: 0; 
      visibility: hidden; 
      transform: translateX(-6px) scale(0.95);
      border: 1px solid var(--capsule-border); 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .post-menu-popup.active { opacity: 1; visibility: visible; transform: translateX(0) scale(1); }
    .drawer-handle { display: none; }
    
    .post-menu-item {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 10px;
      color: var(--text-primary); font-size: 14px; font-weight: 500; background: transparent; border: none; cursor: pointer; text-align: left;
    }
    .post-menu-item:hover { background-color: var(--menu-hover); }
    .post-menu-item.danger { color: #ff3040; font-weight: 600; }
    .post-menu-item iconify-icon { font-size: 22px; }

    /* Post Media & Bottom Actions */
    .post-media {
      width: calc(100% - 32px); margin: 4px 16px 0 16px; position: relative;
      border-radius: 16px; overflow: hidden; background-color: rgba(0, 0, 0, 0.03);
    }
    .post-media img { width: 100%; height: auto; display: block; object-fit: contain; max-height: 750px; }
    
    /* ENLARGED POST ACTIONS */
    .post-actions { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 16px; 
    }
    
    .action-capsule {
      display: inline-flex; 
      align-items: center; 
      gap: 14px; 
      background-color: var(--capsule-bg);
      border: 1px solid var(--capsule-border); 
      padding: 6px 16px; 
      border-radius: 32px; 
      height: 46px; 
      box-shadow: none !important;
    }
    .action-btn {
      background: none; border: none; color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 600; padding: 2px;
    }
    .action-btn iconify-icon { font-size: 30px; }
    .action-btn:hover { opacity: 0.75; }
    .action-btn.liked iconify-icon { color: var(--like-color); }
    
    .bookmark-btn {
      background: none; border: none; color: var(--text-primary); cursor: pointer; padding: 6px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .bookmark-btn:hover { background-color: var(--hover-bg); }
    .bookmark-btn iconify-icon { font-size: 30px; }

    /* RIGHT SIDEBAR CONTAINER (Desktop Only) */
    .right-sidebar-container { display: none; }

    /* ENLARGED NOTIFICATION CAPSULE */
    .right-sidebar-capsule {
      display: inline-flex; 
      align-items: center; 
      gap: 12px; 
      padding: 10px 22px; 
      border-radius: 32px;
      height: 48px;
      background-color: var(--capsule-bg); 
      border: 1px solid var(--capsule-border); 
      color: var(--text-primary);
      cursor: pointer; 
      font-weight: 600; 
      font-size: 15px; 
      width: fit-content; 
      box-shadow: none !important; 
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .right-sidebar-capsule:hover { background-color: var(--menu-hover); transform: translateY(-2px); }
    .right-sidebar-capsule iconify-icon { font-size: 24px; color: var(--icon-color); }
    .right-sidebar-capsule .notification-badge { border-color: var(--capsule-bg); }

    /* Auto-hide capsule when overlapping with post menu container */
    .right-sidebar-capsule.hidden-overlap {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translateY(-8px) scale(0.95);
    }

    /* ENLARGED ICON-ONLY MENU BUTTON */
    .icon-only-btn {
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      width: 48px; 
      height: 48px;
      border-radius: 50%; 
      background-color: var(--capsule-bg); 
      border: 1px solid var(--capsule-border);
      color: var(--text-primary); 
      cursor: pointer; 
      box-shadow: none !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .icon-only-btn:hover { background-color: var(--menu-hover); transform: translateY(-2px); }
    .icon-only-btn iconify-icon { font-size: 26px; color: var(--icon-color); }

    /* GLOBAL SETTINGS MENU POPUP - WITH SHADOW RESTORED */
    .menu-popup {
      position: fixed; background-color: var(--menu-bg); border-radius: 16px; padding: 8px;
      box-shadow: var(--menu-shadow) !important; display: flex; flex-direction: column; z-index: 2000;
      opacity: 0; visibility: hidden; border: 1px solid var(--capsule-border);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .menu-popup.active { opacity: 1; visibility: visible; }
    
    .menu-group { display: flex; flex-direction: column; gap: 2px; }
    .menu-item {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border-radius: 12px;
      color: var(--text-primary); font-size: 14px; font-weight: 500; text-decoration: none; background: transparent; border: none; cursor: pointer; text-align: left;
    }
    .menu-item:hover { background-color: var(--menu-hover); }
    .menu-item iconify-icon { font-size: 22px; color: var(--text-primary); }
    .menu-divider { height: 1px; background-color: var(--divider-color); margin: 6px 0; }


    /* -------------------------------------- */
    /* RESPONSIVE BREAKPOINTS                 */
    /* -------------------------------------- */

    /* MOBILE: Max Width 767px */
    @media (max-width: 767px) {
      .mobile-header {
        display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 64px; background-color: var(--nav-bg); z-index: 1000; align-items: center; justify-content: space-between; padding: 0 16px; transition: transform 0.3s ease;
      }
      .mobile-header.hidden { transform: translateY(-100%); }
      .mobile-action-btn { background: transparent; border: none; color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; width: 40px; }
      .mobile-brand-name { flex: 1; text-align: center; font-family: 'Grand Hotel', cursive; font-size: 34px; color: var(--text-primary); line-height: 1; margin-top: 4px; letter-spacing: 0.5px; }
      
      .main-content-wrapper { margin-left: 0; padding-top: 64px; padding-bottom: 74px; justify-content: center; }
      .middle-container { gap: 16px; }
      .post-card { border-radius: 0; padding-bottom: 0px; }
      .post-media { width: 100%; margin: 4px 0 0 0; border-radius: 0; }
      .post-header-actions { height: 32px; }
      .post-follow-btn { height: 34px; padding: 0 18px; font-size: 14px; border-radius: 8px; }
      .post-more-btn { width: 36px; height: 36px; }
      .post-more-btn iconify-icon { font-size: 28px; }
      
      .post-menu-popup {
        position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; border-radius: 24px 24px 0 0;
        padding: 24px 16px calc(env(safe-area-inset-bottom, 16px) + 24px) 16px; transform: translateY(100%);
        box-shadow: var(--menu-shadow) !important; border: none; border-top: 1px solid var(--divider-color); z-index: 2000;
        transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease, visibility 0.3s; touch-action: none;
      }
      .post-menu-popup.active { transform: translateY(0); }
      .drawer-handle { display: block; width: 44px; height: 5px; background-color: var(--text-secondary); border-radius: 5px; margin: -12px auto 20px auto; opacity: 0.5; }
      .post-actions { padding: 12px 14px; }
      .action-capsule { height: 42px; padding: 4px 12px; gap: 10px; }
      .action-btn iconify-icon, .bookmark-btn iconify-icon { font-size: 26px; }

      .nav-wrapper { bottom: 0; left: 0; width: 100%; height: 58px; padding-bottom: env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--divider-color) !important; }
      .main-navigation, .nav-list { width: 100%; height: 100%; }
      .nav-list { display: flex; list-style: none; }
      .nav-list li { flex: 1 1 0%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .nav-item { justify-content: center; width: 48px; padding: 0; height: 100%; }
      
      .nav-text { display: none !important; }
      
      .menu-popup {
        bottom: 90px; left: 16px; width: 240px; transform: translateY(10px) scale(0.95);
      }
      .menu-popup.active { transform: translateY(0) scale(1); }
    }


    /* DESKTOP & TABLET: Top-Left Logo, Floating Nav Dock, & Top-Right Sidebar Controls */
    @media (min-width: 768px) {
      .bottom-fade-mask { display: block; }

      /* Top-Left Logo */
      .desktop-brand-logo {
        display: flex; position: fixed; top: 32px; left: 32px; z-index: 1000; align-items: center;
      }
      .desktop-brand-logo .brand-text {
        font-family: 'Grand Hotel', cursive; font-size: 42px; color: var(--text-primary); line-height: 1; letter-spacing: 0.5px;
      }

      /* Bottom Floating Nav Capsule */
      .nav-wrapper {
        top: auto; bottom: 32px; left: 50%; transform: translateX(-50%);
        width: auto !important; height: auto; display: flex; flex-direction: row;
        padding: 8px 12px; border-radius: 40px; background-color: var(--capsule-bg);
        border: 1px solid var(--capsule-border) !important;
        box-shadow: none !important;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      }
      
      .nav-list { display: flex; flex-direction: row; gap: 8px; list-style: none; }
      
      .nav-item {
        padding: 10px 18px; border-radius: 30px; height: 48px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); justify-content: center;
      }
      .nav-item:hover { background-color: var(--hover-bg); }
      .nav-item.active { background-color: var(--active-bg); }
      
      .nav-item .nav-text {
        width: 0; opacity: 0; overflow: hidden; padding-left: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .nav-item.active .nav-text { width: auto; opacity: 1; padding-left: 4px; }

      /* Centered Feed */
      .main-content-wrapper { margin: 0 auto; justify-content: center; padding-top: 40px; padding-bottom: 140px; }
      .middle-container { margin: 0 auto; }

      /* Top-Right Sidebar Row Configuration */
      .right-sidebar-container {
        display: flex; flex-direction: row; gap: 12px;
        position: fixed; top: 32px; right: 32px; z-index: 1000; align-items: center;
      }
      
      /* Global Dropdown popup directly under the Icon Menu */
      .menu-popup {
        top: 88px; right: 32px; width: 260px; transform: translateY(-10px) scale(0.95);
      }
      .menu-popup.active { transform: translateY(0) scale(1); }
      
      .mobile-notification-item { display: none !important; }
    }

  </style>
</head>
<body>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Fade element to prevent posts colliding visually with floating capsule -->
  <div class="bottom-fade-mask"></div>

  <!-- Top-Left Desktop Logo ("Bond") -->
  <div class="desktop-brand-logo">
    <span class="brand-text">Bond</span>
  </div>

  <!-- Top Mobile Header -->
  <header class="mobile-header" id="mobileHeader">
    <button class="mobile-action-btn" id="mobileMenuToggle" aria-label="Menu">
      <iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon>
    </button>
    
    <span class="mobile-brand-name">Bond</span>
    
    <button class="mobile-action-btn" id="mobileThemeToggle" aria-label="Toggle Theme">
      <iconify-icon id="mobileThemeIcon" icon="solar:moon-linear"></iconify-icon>
    </button>
  </header>

  <div class="app-layout">

    <!-- Floating Navigation Capsule -->
    <nav class="nav-wrapper" id="sidebar">
      <div class="main-navigation">
        <ul class="nav-list">
          <li>
            <a href="#" class="nav-item active" data-outline="solar:home-angle-linear" data-filled="solar:home-angle-bold" aria-label="Home">
              <iconify-icon icon="solar:home-angle-bold"></iconify-icon>
              <span class="nav-text">Home</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-outline="solar:global-linear" data-filled="solar:global-bold" aria-label="Explore">
              <iconify-icon icon="solar:global-linear"></iconify-icon>
              <span class="nav-text">Explore</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-outline="solar:document-add-linear" data-filled="solar:document-add-bold" aria-label="Create">
              <iconify-icon icon="solar:document-add-linear"></iconify-icon>
              <span class="nav-text">Create</span>
            </a>
          </li>
          <!-- Mobile Only Notification Item -->
          <li class="mobile-notification-item">
            <a href="#" class="nav-item" data-outline="solar:bell-outline" data-filled="solar:bell-bold" aria-label="Notifications">
              <div class="icon-badge-wrapper">
                <iconify-icon icon="solar:bell-outline"></iconify-icon>
                <span class="notification-badge">3</span>
              </div>
              <span class="nav-text">Notifs</span>
            </a>
          </li>
          <li>
            <a href="#" class="nav-item" data-type="profile" aria-label="Profile">
              <div class="profile-avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Profile">
              </div>
              <span class="nav-text">Profile</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content Feed Area -->
    <div class="main-content-wrapper">
      <main class="middle-container">

        <!-- Post 1 -->
        <article class="post-card">
          <header class="post-header">
            <div class="post-author-row">
              <div class="post-author-left">
                <div class="author-avatar">

  <!-- Global App Options Menu -->
  <div class="menu-popup" id="menuPopup">
    <div class="menu-group">
      <button class="menu-item"><iconify-icon icon="solar:settings-linear"></iconify-icon><span>Settings</span></button>
      <button class="menu-item"><iconify-icon icon="solar:history-linear"></iconify-icon><span>Your activity</span></button>
      <button class="menu-item"><iconify-icon icon="solar:bookmark-linear"></iconify-icon><span>Saved</span></button>
      <button class="menu-item" id="themeToggleItem">
        <iconify-icon id="themeMenuIcon" icon="solar:moon-linear"></iconify-icon>
        <span>Switch appearance</span>
      </button>
      <button class="menu-item"><iconify-icon icon="solar:danger-circle-linear"></iconify-icon><span>Report a problem</span></button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-group">
      <button class="menu-item"><span>Switch accounts</span></button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-group">
      <button class="menu-item"><span>Log out</span></button>
    </div>
  </div>

  <script>
    const mobileHeader = document.getElementById('mobileHeader');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const notifCapsule = document.getElementById('notifCapsule');
    let lastScrollTop = 0;

    // Collision detection to hide Notification capsule if post options menu overlaps it
    function checkNotificationOverlap() {
      if (!notifCapsule || window.innerWidth < 768) return;

      const notifRect = notifCapsule.getBoundingClientRect();
      let shouldHide = false;

      document.querySelectorAll('.post-menu-popup.active').forEach(popup => {
        const pRect = popup.getBoundingClientRect();
        if (rectsOverlap(notifRect, pRect)) {
          shouldHide = true;
        }
      });

      document.querySelectorAll('.post-more-wrapper').forEach(wrapper => {
        const wRect = wrapper.getBoundingClientRect();
        if (rectsOverlap(notifRect, wRect)) {
          shouldHide = true;
        }
      });

      if (shouldHide) {
        notifCapsule.classList.add('hidden-overlap');
      } else {
        notifCapsule.classList.remove('hidden-overlap');
      }
    }

    function rectsOverlap(r1, r2) {
      return !(r2.left > r1.right || 
               r2.right < r1.left || 
               r2.top > r1.bottom || 
               r2.bottom < r1.top);
    }

    window.addEventListener('scroll', () => {
      const st = window.pageYOffset || document.documentElement.scrollTop;
      if (window.innerWidth <= 767) {
        if (st > lastScrollTop && st > 64) {
          mobileHeader.classList.add('hidden');
        } else {
          mobileHeader.classList.remove('hidden');
        }
      }
      lastScrollTop = st <= 0 ? 0 : st; 

      checkNotificationOverlap();
    }, { passive: true });

    // Floating Capsule Nav Switcher
    const navItems = document.querySelectorAll('.nav-list .nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        navItems.forEach(link => {
          link.classList.remove('active');
          const icon = link.querySelector('iconify-icon');
          const outlineIcon = link.getAttribute('data-outline');
          if (icon && outlineIcon) icon.setAttribute('icon', outlineIcon);
        });
        item.classList.add('active');
        const icon = item.querySelector('iconify-icon');
        const filledIcon = item.getAttribute('data-filled');
        if (icon && filledIcon) icon.setAttribute('icon', filledIcon);
      });
    });

    // App Menu Popups
    const desktopMenuToggle = document.getElementById('desktopMenuToggle');
    const mobileMenuToggle = document.getElementById('mobileMenuToggle');
    const menuPopup = document.getElementById('menuPopup');

    function toggleAppMenu(e) {
      e.stopPropagation();
      closeAllPostMenus();
      menuPopup.classList.toggle('active');
      
      if (window.innerWidth <= 767) {
        if (menuPopup.classList.contains('active')) {
          drawerOverlay.classList.add('active');
          document.body.classList.add('no-scroll');
        } else {
          drawerOverlay.classList.remove('active');
          document.body.classList.remove('no-scroll');
        }
      }
    }

    if (desktopMenuToggle) desktopMenuToggle.addEventListener('click', toggleAppMenu);
    if (mobileMenuToggle) mobileMenuToggle.addEventListener('click', toggleAppMenu);

    function closeAllPostMenus() {
      document.querySelectorAll('.post-menu-popup').forEach(p => {
        p.classList.remove('active');
        p.style.transform = ''; 
      });
      if (drawerOverlay) drawerOverlay.classList.remove('active');
      document.body.classList.remove('no-scroll');
      checkNotificationOverlap();
    }

    // Post Options Individual Dropdowns
    document.querySelectorAll('.post-more-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wrapper = btn.closest('.post-more-wrapper');
        const popup = wrapper.querySelector('.post-menu-popup');

        if (menuPopup) menuPopup.classList.remove('active');
        const isCurrentlyActive = popup.classList.contains('active');

        closeAllPostMenus();

        if (!isCurrentlyActive) {
          popup.classList.add('active');
          if (window.innerWidth <= 767) {
            if (drawerOverlay) drawerOverlay.classList.add('active');
            document.body.classList.add('no-scroll');
          }
        }
        checkNotificationOverlap();
      });
    });

    // Mobile Slide-to-Close Drawer Logic
    let startY = 0; let currentY = 0; let isDragging = false;
    document.querySelectorAll('.post-menu-popup, #menuPopup').forEach(popup => {
      popup.addEventListener('touchstart', (e) => {
        if (window.innerWidth > 767 || !popup.classList.contains('active')) return;
        startY = e.touches[0].clientY;
        isDragging = true;
        popup.style.transition = 'none'; 
      }, {passive: true});

      popup.addEventListener('touchmove', (e) => {
        if (!isDragging || window.innerWidth > 767) return;
        currentY = e.touches[0].clientY;
        let deltaY = currentY - startY;
        
        if (deltaY > 0) {
          popup.style.transform = `translateY(${deltaY}px)`;
          e.preventDefault(); 
        }
      }, {passive: false}); 

      popup.addEventListener('touchend', (e) => {
        if (!isDragging || window.innerWidth > 767) return;
        isDragging = false;
        popup.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s'; 
        
        let deltaY = currentY - startY;
        if (deltaY > 60) {
          popup.classList.remove('active');
          if (drawerOverlay) drawerOverlay.classList.remove('active');
          document.body.classList.remove('no-scroll');
        }
        popup.style.transform = ''; 
      });
    });

    // Follow Interactions
    document.querySelectorAll('.post-follow-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('following')) {
          btn.classList.remove('following');
          btn.innerText = 'Follow';
        } else {
          btn.classList.add('following');
          btn.innerText = 'Following';
        }
      });
    });

    // Global Click-to-Close
    document.addEventListener('click', (e) => {
      if (menuPopup && !menuPopup.contains(e.target) && 
         (!desktopMenuToggle || !desktopMenuToggle.contains(e.target)) && 
         (!mobileMenuToggle || !mobileMenuToggle.contains(e.target))) {
        menuPopup.classList.remove('active');
      }

      if (e.target === drawerOverlay) {
        closeAllPostMenus();
        if (menuPopup) menuPopup.classList.remove('active');
        return;
      }

      let clickedInsideAnyPostMenu = false;
      document.querySelectorAll('.post-menu-popup').forEach(popup => {
        if (popup.contains(e.target)) {
          clickedInsideAnyPostMenu = true;
        } else {
          popup.classList.remove('active');
          popup.style.transform = '';
        }
      });

      if (!clickedInsideAnyPostMenu && window.innerWidth > 767) {
         if(drawerOverlay) drawerOverlay.classList.remove('active');
         document.body.classList.remove('no-scroll');
      }

      checkNotificationOverlap();
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth > 767) {
        if (drawerOverlay) drawerOverlay.classList.remove('active');
        document.body.classList.remove('no-scroll');
      }
      checkNotificationOverlap();
    });

    // Theme Switcher
    const htmlRoot = document.documentElement;
    function updateTheme(newTheme) {
      htmlRoot.setAttribute('data-theme', newTheme);
      const iconName = newTheme === 'dark' ? 'solar:moon-linear' : 'solar:sun-2-linear';
      const themeMenuIcon = document.getElementById('themeMenuIcon');
      const mobileThemeIcon = document.getElementById('mobileThemeIcon');
      if (themeMenuIcon) themeMenuIcon.setAttribute('icon', iconName);
      if (mobileThemeIcon) mobileThemeIcon.setAttribute('icon', iconName);
    }
    
    document.getElementById('themeToggleItem').addEventListener('click', () => {
      updateTheme(htmlRoot.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    const mobileThemeToggle = document.getElementById('mobileThemeToggle');
    if (mobileThemeToggle) {
      mobileThemeToggle.addEventListener('click', () => {
        updateTheme(htmlRoot.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    }

    // Likes & Bookmarks Logic
    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('liked');
        const icon = btn.querySelector('iconify-icon');
        icon.setAttribute('icon', btn.classList.contains('liked') ? 'solar:heart-bold' : 'solar:heart-linear');
      });
    });

    document.querySelectorAll('.bookmark-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('bookmarked');
        const icon = btn.querySelector('iconify-icon');
        icon.setAttribute('icon', btn.classList.contains('bookmarked') ? 'solar:bookmark-bold' : 'solar:bookmark-linear');
      });
    });
  </script>
